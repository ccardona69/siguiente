<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#151210">
  <title>Siguiente</title>
  <style>
    /* Base: taller nocturno, café tostado con lino crema y un solo acento terracota */
    :root {
      color-scheme: dark;
      --bg: #151210;
      --surface: #201B17;
      --surface-2: #2D2520;
      --text: #F5EFE6;
      --text-dim: #A89E92;
      --text-faint: #756D63;
      --line: rgba(245, 239, 230, .12);
      --line-strong: rgba(245, 239, 230, .28);
      --accent: #E07A43;
      --accent-ink: #151210;
      --done: #F5EFE6;
      --progress: #A89E92;
      --stuck: #756D63;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --display: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --maxw: 700px;
      --r-control: 10px;
      --r-panel: 14px;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; margin: 0; }
    html { background: var(--bg); }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      width: 100%; max-width: var(--maxw); min-height: 100vh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) clamp(24px, 6vw, 48px) calc(104px + env(safe-area-inset-bottom));
    }
    ::selection { background: rgba(224, 122, 67, .32); }
    button, input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    input:focus-visible { outline-offset: 1px; }

    /* Cabecera: el título es la fecha o la vista; el guardado queda a un lado */
    .appbar { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .appbar-title { min-width: 0; margin-right: auto; }
    .appbar h1 { margin: 0; font: 500 clamp(30px, 6vw, 38px)/1.08 var(--display); letter-spacing: -.025em; }
    .appbar-tools { display: flex; flex: none; align-items: center; gap: 8px; }
    .saveind { max-width: 112px; color: var(--text-dim); font-size: 12px; line-height: 1.3; text-align: right; }
    .iconbtn {
      display: grid; flex: none; place-items: center;
      width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--line); border-radius: var(--r-control);
      background: var(--surface); color: var(--text-dim); cursor: pointer;
    }
    .iconbtn:hover { background: var(--surface); color: var(--text); }
    .iconbtn svg { width: 20px; height: 20px; }

    /* Captura: una línea de escritura, siempre disponible y sin competir con la acción */
    .capture, .field input, .log-search {
      width: 100%; min-height: 50px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: var(--r-control);
      background: var(--surface); color: var(--text);
      font: 400 15px/1.4 var(--font);
    }
    .capture { margin-bottom: 38px; }
    .capture::placeholder, .log-search::placeholder { color: var(--text-dim); }
    .capture:focus, .field input:focus, .log-search:focus { border-color: var(--line-strong); }

    /* Botones: la terracota es solo para la acción principal; el resto es lino sobre café */
    .btn {
      display: block; width: 100%; min-height: 54px; padding: 13px 18px;
      border: 1px solid transparent; border-radius: var(--r-control);
      font: 650 15px/1.25 var(--font); letter-spacing: .005em; text-align: center; cursor: pointer;
    }
    .btn--primary { background: var(--accent); color: var(--accent-ink); }
    .btn--quiet { border-color: var(--line-strong); background: var(--surface); color: var(--text); }
    .btn--text { background: transparent; color: var(--text-dim); font-weight: 500; }
    .btn--text:hover { color: var(--text); }
    .btn--small { width: auto; min-height: 44px; padding: 9px 15px; font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .link {
      border: 0; background: transparent; color: var(--text-dim);
      font: 500 13px/1.4 var(--font); text-decoration: underline;
      text-decoration-color: rgba(168, 158, 146, .5); text-underline-offset: 4px;
      padding: 12px 0; cursor: pointer;
    }
    .link:hover { color: var(--text); }
    .badge { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text-dim); font-size: 12px; }

    /* Hoy: la acción se escribe directamente sobre el fondo, sin tarjeta */
    .now { padding-bottom: 36px; border-bottom: 1px solid var(--line-strong); }
    .task-context { display: block; margin: 0 0 17px; color: var(--text-dim); font-size: 14px; line-height: 1.45; }
    .task-context span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero {
      max-width: 20ch; margin: 0;
      font: 500 clamp(36px, 8vw, 56px)/1.08 var(--display);
      letter-spacing: -.025em; overflow-wrap: anywhere;
    }
    .for-outcome { max-width: 50ch; margin: 22px 0 0; color: var(--text-dim); font-size: 15px; line-height: 1.55; }
    .for-outcome strong { color: var(--text); font-weight: 700; }
    .now-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; margin-top: 34px; }
    .now-actions .btn--primary { width: min(100%, 360px); min-height: 60px; font-size: 16px; }
    .now-actions .btn--text { width: auto; min-height: 48px; padding-left: 0; text-align: left; }
    .section-label { margin: 40px 0 0; color: var(--text); font: 500 21px/1.25 var(--display); letter-spacing: -.01em; }
    .rows { list-style: none; margin: 8px 0 0; padding: 0; }
    .rows > li { border-bottom: 1px solid var(--line); }
    .later { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 0; }
    .later .txt { flex: 1; min-width: 0; color: var(--text); font-size: 15px; line-height: 1.45; }
    .later .sub { display: block; margin-top: 4px; color: var(--text-dim); font-size: 13px; }
    .later .link { flex: none; }

    /* Bandeja: entradas planas, separadas por una línea */
    .task { padding: 24px 0 26px; }
    .task--captured { margin: 0 -14px; padding-right: 14px; padding-left: 14px; border-radius: var(--r-panel); background: var(--surface); scroll-margin-block: 110px; }
    .task .t-topline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 10px; }
    .task .t-title { color: var(--text); font: 500 21px/1.28 var(--display); letter-spacing: -.012em; }
    .task .t-tag { padding: 3px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--text-dim); font-size: 12px; }
    .task .t-next { margin-top: 9px; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
    .task .t-next.none { color: var(--text-dim); }
    .task .t-dur { margin-top: 8px; color: var(--text-dim); font-size: 12px; }
    .task .t-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 18px; }
    .task .field { margin: 16px 0 8px; }
    .task #inline-action { margin: 0; background: var(--bg); }
    .task .action-hint { margin: 8px 0 0; color: var(--text-dim); font-size: 12px; }
    .task .btn--primary { border-color: var(--line-strong); background: var(--text); color: var(--accent-ink); }

    /* Formularios, ajustes y avisos: un mismo vocabulario */
    .define-card, .close-card { padding: clamp(20px, 5vw, 28px); border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
    .define-for { margin: 0; padding-bottom: 16px; border-bottom: 1px solid var(--line); color: var(--text); font: 500 19px/1.3 var(--display); }
    .field { display: block; margin-top: 18px; }
    .field span { display: block; margin-bottom: 7px; color: var(--text-dim); font-size: 13px; }
    .q { margin: 0 0 9px; font: 500 28px/1.2 var(--display); }
    .notice { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface); color: var(--text-dim); font-size: 14px; line-height: 1.5; }
    .notice.as-button { display: block; width: 100%; color: var(--text); text-align: left; cursor: pointer; }
    .empty { margin-top: 8px; padding: 26px 22px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); color: var(--text-dim); }
    .empty p { margin: 0 0 18px; }
    .empty .btn { margin-top: 6px; }
    .undobar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .undobar .link { flex: none; }
    .menu-card { padding-top: 4px; }
    .filelabel { position: relative; display: grid; place-items: center; overflow: hidden; }
    .filelabel input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .ajustar-title { margin: 0 0 6px; font: 500 24px/1.25 var(--display); overflow-wrap: anywhere; }
    .ajustar-note { max-width: 50ch; margin: 14px 0 0; color: var(--text-dim); font-size: 14px; line-height: 1.55; }
    .ajustar-note strong { color: var(--text); font-weight: 700; }
    .ajustar-note--faint { margin-top: 4px; color: var(--text-dim); }

    /* Sesión: el tiempo es la única cifra grande; una barra fina muestra que corre, sin meta */
    .view--full { min-height: calc(100vh - 120px); min-height: calc(100dvh - 120px); }
    .session { display: flex; min-height: calc(100vh - 140px); min-height: calc(100dvh - 140px); flex-direction: column; }
    .session-top { padding-top: 26px; }
    .session .hero { max-width: 26ch; font-size: clamp(22px, 5.5vw, 28px); line-height: 1.25; }
    .session .for-outcome { margin-top: 12px; }
    .tempo-stage { padding: 64px 0 52px; }
    .tempo-time { display: block; margin: 0; color: var(--text); font: 500 clamp(52px, 14vw, 88px)/1 var(--display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .tempo-note { margin: 12px 0 0; color: var(--text-dim); font-size: 14px; }
    .tempo { position: relative; height: 2px; margin-top: 30px; border-radius: 2px; background: var(--line-strong); }
    .tempo-fill { position: absolute; top: -4px; left: 0; width: 3px; height: 10px; border-radius: 2px; background: var(--accent); }
    .tempo-stage.is-paused .tempo-fill { background: var(--text-faint); }
    .tempo-stage.is-paused .tempo-time { color: var(--text-dim); }
    .session-end { display: grid; gap: 10px; margin-top: auto; padding-bottom: 24px; }
    .session-end .btn--primary { background: var(--text); color: var(--accent-ink); }
    .close-card { margin-top: 34px; }
    .close-card .kicker { margin: 0 0 12px; color: var(--text-dim); font-size: 14px; }
    .results { display: grid; gap: 10px; margin-top: 20px; }
    .result { width: 100%; min-height: 56px; padding: 14px 18px; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: transparent; color: var(--text); font: 700 16px/1.3 var(--font); text-align: left; cursor: pointer; }

    /* Semana: la fecha a la izquierda como en un cuaderno y las sesiones en columna */
    .week-range { margin: 0 0 14px; color: var(--text-dim); font-size: 14px; }
    .week-stack { display: grid; }
    .day { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .day.today { margin: 8px -16px 0; padding: 22px 16px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
    .day-head { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; margin: 0; }
    .day-head .d-name { color: var(--text-dim); font-size: 13px; font-weight: 400; text-transform: capitalize; }
    .day-head .d-date { color: var(--text); font: 500 19px/1.2 var(--display); white-space: nowrap; }
    .day-head .d-today { margin-top: 4px; color: var(--text); font-size: 12px; font-weight: 700; }
    .day-body { min-width: 0; }
    .day-body .d-total { margin: 0 0 9px; color: var(--text-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
    .day-items { list-style: none; margin: 0; padding: 0; }
    .d-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: baseline; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); color: var(--text); font-size: 14px; line-height: 1.4; }
    .d-item .d-time, .d-item .d-dur { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .d-item .d-task { min-width: 0; overflow-wrap: anywhere; }
    .day-plan { margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--line); }
    .day-body > .day-plan:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .day-plan-label { margin: 0 0 4px; color: var(--text-dim); font-size: 13px; }
    .day-plan .d-item { grid-template-columns: minmax(0, 1fr); border-top: 0; color: var(--text-dim); }
    .day-empty { margin: 1px 0 0; color: var(--text-dim); font-size: 14px; }

    /* Progreso: cifras en filas y registro sin paneles repetidos */
    .panel { padding: 10px 22px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
    .panel-note { margin: 12px 0 3px; color: var(--text-dim); font-size: 13px; }
    .figures { display: grid; }
    .figure { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 15px 0; }
    .figure + .figure { border-top: 1px solid var(--line); }
    .figure strong { order: 1; color: var(--text); font: 500 23px/1.2 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .figure span { color: var(--text-dim); font-size: 14px; line-height: 1.4; }
    .log-controls { display: grid; gap: 12px; margin: 16px 0 4px; }
    .log-search { min-height: 48px; }
    .log-month { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface); }
    .log-month span { color: var(--text); font-size: 14px; text-align: center; }
    .log-month-btn { flex: none; width: 48px; height: 48px; border: 0; border-radius: var(--r-control); background: transparent; color: var(--text); font: 22px/1 var(--font); cursor: pointer; }
    .log { list-style: none; margin: 0; padding: 0; }
    .log > li { padding: 24px 0; border-bottom: 1px solid var(--line); }
    .log-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 10px; color: var(--text-dim); font-size: 13px; }
    .log-head .l-task { grid-column: 1; grid-row: 1; min-width: 0; color: var(--text); font: 500 19px/1.3 var(--display); overflow-wrap: anywhere; }
    .log-head .l-dur { grid-column: 2; grid-row: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .log-head > span:first-child { grid-column: 1 / -1; grid-row: 2; }
    .log-outcome { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; color: var(--text-dim); font-size: 13px; }
    .log-step { display: block; margin: 7px 0 0; color: var(--text-dim); font-size: 13px; overflow-wrap: anywhere; }
    .log-empty { margin: 19px 0; color: var(--text-dim); font-size: 14px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transform: translateY(-1px); }
    .dot--done { background: var(--done); }
    .dot--progress { background: transparent; box-shadow: inset 0 0 0 2px var(--progress); }
    .dot--stuck { background: transparent; box-shadow: inset 0 0 0 2px var(--stuck); }

    /* Navegación: barra pegada al borde inferior, texto sin iconos y una línea marca la vista actual */
    .tabbar { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; max-width: var(--maxw); margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: var(--bg); }
    .tab { position: relative; min-height: 60px; padding: 8px 4px; border: 0; background: transparent; color: var(--text-dim); font: 500 14px/1 var(--font); cursor: pointer; }
    .tab:hover { color: var(--text); }
    .tab[aria-current="page"] { color: var(--text); font-weight: 700; }
    .tab[aria-current="page"]::before { position: absolute; top: -1px; right: 22%; left: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); content: ""; }
    .btn, .tab, .iconbtn, .link, .result, .filelabel, .log-month-btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    /* Pantallas estrechas: el indicador de guardado sigue visible */
    @media (max-width: 350px) {
      #app { padding-right: 18px; padding-left: 18px; }
      .appbar h1 { font-size: 27px; }
      .saveind { max-width: 76px; font-size: 10px; }
      .hero { font-size: 32px; }
      .day { grid-template-columns: 54px minmax(0, 1fr); gap: 10px; }
      .day-head .d-date { font-size: 16px; }
      .d-item { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 5px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .btn, .tab, .iconbtn, .result, .log-month-btn { transition: background-color .15s ease, color .15s ease, transform .12s ease; }
      .btn:active, .result:active, .log-month-btn:active { transform: scale(.98); }
      .tempo-fill { transition: left 1s linear; }
    }

    /* Impresión: papel blanco y únicamente el registro del mes visible */
    @media print {
      @page { margin: 18mm; }
      :root { color-scheme: light; }
      html, body, #app { min-height: 0; background: #fff !important; color: #111; }
      #app { max-width: none; margin: 0; padding: 0; }
      .appbar, .capture, .tabbar, .view > :not(.log) { display: none !important; }
      .view, .log { padding: 0; border: 0; }
      .log { display: block; margin: 0; }
      .log::before { display: block; margin-bottom: 12mm; content: "Registro — " attr(data-month); font-size: 18pt; font-weight: 600; }
      .log > li { break-inside: avoid; margin: 0; padding: 5mm 0; border: 0; border-bottom: 1px solid #ccc; border-radius: 0; background: none; color: #111; }
      .log > li::before, .log-outcome .dot { display: none; }
      .log-head { display: grid; grid-template-columns: 1fr; gap: 1mm; color: #111; font-size: 10pt; }
      .log-head > span:first-child { grid-column: 1; grid-row: 1; }
      .log-head .l-task { grid-column: 1; grid-row: 2; color: #111; font: 600 11pt/1.4 var(--font); }
      .log-head .l-dur { grid-column: 1; grid-row: 3; }
      .log-head > span:first-child::before { content: "Fecha: "; }
      .log-head .l-task::before { content: "Tarea: "; }
      .log-head .l-dur::before { content: "Duración: "; }
      .log-outcome { margin: 1mm 0 0; color: #111; font-size: 10pt; }
      .log-outcome::before { content: "Resultado: "; }
      .log-step { margin: 1mm 0 0; color: #111; font-size: 10pt; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script src="core.js"></script>
  <script>
  (function () {
    'use strict';

    var Core = globalThis.SiguienteCore;

    // ---------- adaptador local: única puerta a la persistencia del navegador ----------
    var LocalStorageAdapter = {
      key: 'siguiente.v1',
      load: function () {
        var key = this.key;
        return new Promise(function (resolve) {
          try {
            var raw = localStorage.getItem(key);
            resolve(raw ? JSON.parse(raw) : null);
          } catch (e) {
            resolve(null);
          }
        });
      },
      save: function (state) {
        var key = this.key;
        return new Promise(function (resolve, reject) {
          try {
            localStorage.setItem(key, JSON.stringify(state));
            resolve();
          } catch (e) {
            reject(e);
          }
        });
      }
    };

    // ---------- adaptador remoto: guarda y devuelve el estado completo contra el Worker ----------
    // la ruta es relativa; solo funciona cuando la app se sirve desde su propio origen
    var SYNC_PATH = '/api/state';

    // token de sincronización guardado solo en este equipo; nunca viaja en la URL
    function syncToken() {
      try {
        return localStorage.getItem('siguiente.token') || '';
      } catch (e) {
        return '';
      }
    }
    function setSyncToken(value) {
      var t = String(value == null ? '' : value).trim();
      try {
        if (t) localStorage.setItem('siguiente.token', t);
        else localStorage.removeItem('siguiente.token');
      } catch (e) {}
    }

    // cabeceras de autorización solo si hay token configurado
    function authHeaders() {
      var t = syncToken();
      return t ? { 'Authorization': 'Bearer ' + t } : {};
    }

    // estado venido de fuera, migrado y validado; null si no es usable
    function usableRemote(s) {
      if (!s || typeof s !== 'object' || Array.isArray(s)) return null;
      var m = Core.migrate(s);
      return Core.validateState(m).ok ? m : null;
    }

    var RemoteAdapter = {
      etag: null, // ETag del último GET/PUT: la revisión que este equipo cree vigente
      load: function () {
        var self = this;
        return fetch(SYNC_PATH, { headers: authHeaders(), cache: 'no-store' }).then(function (res) {
          if (!res.ok) throw new Error('estado remoto no disponible');
          self.etag = res.headers.get('ETag');
          return res.json();
        }).then(function (body) {
          if (!body || !body.state) return null;
          // un estado remoto con forma inválida se descarta y se sigue con la copia local
          var state = usableRemote(body.state);
          if (!state) throw new Error('estado remoto inválido');
          return state;
        });
      },
      save: function (state) {
        var self = this;
        // sin ETag conocido el PUT saldría incondicional: primero un GET de sondeo y el
        // resultado entra por la vía de conflicto, que fusiona antes de reintentar
        if (!self.etag) {
          return self.load().then(function (loaded) {
            var e = new Error('conflicto de revisión');
            e.conflict = true;
            e.state = loaded;
            throw e;
          });
        }
        var headers = Object.assign({ 'Content-Type': 'application/json' }, authHeaders());
        // precondición de revisión: solo se envía cuando hay un ETag conocido
        headers['If-Match'] = self.etag;
        return fetch(SYNC_PATH, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify(state)
        }).then(function (res) {
          var etag = res.headers.get('ETag');
          if (etag) self.etag = etag;
          if (res.status !== 409) {
            if (!res.ok) throw new Error('no se pudo guardar en el servidor');
            return state;
          }
          // 409: la revisión cambió en la nube; el error lleva el estado vigente para fusionar
          return res.json().then(function (body) {
            var e = new Error('conflicto de revisión');
            e.conflict = true;
            e.state = usableRemote(body && body.state);
            throw e;
          }, function () {
            var e = new Error('conflicto de revisión');
            e.conflict = true;
            e.state = null;
            throw e;
          });
        });
      }
    };

    // ---------- copia base: último estado que este equipo confirmó sincronizado ----------
    // misma persistencia que LocalStorageAdapter con clave propia; solo la toca el
    // adaptador compuesto, como ancestro de la fusión de tres vías
    var BaselineAdapter = Object.assign({}, LocalStorageAdapter, { key: 'siguiente.syncbase.v1' });

    function noop() {}

    // igualdad profunda de valores planos: el orden de las claves no cuenta
    function statesEqual(a, b) {
      if (a === b) return true;
      if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return false;
      if (Array.isArray(a) !== Array.isArray(b)) return false;
      if (Array.isArray(a)) {
        return a.length === b.length && a.every(function (x, i) { return statesEqual(x, b[i]); });
      }
      var ka = Object.keys(a);
      return ka.length === Object.keys(b).length && ka.every(function (k) {
        return Object.prototype.hasOwnProperty.call(b, k) && statesEqual(a[k], b[k]);
      });
    }

    // ---------- adaptador compuesto: local nunca pierde datos, remoto sincroniza si puede ----------
    // respeta el mismo contrato load()/save(state); ni el núcleo ni las vistas lo notan
    function makeCompositeAdapter(local, remote, baseline) {
      var baseState = null;          // último estado remoto válido que este equipo confirmó
      var queue = Promise.resolve(); // los guardados van en serie: nunca dos PUT a la vez

      // encadena un trabajo tras el guardado en curso y devuelve su promesa
      function enqueue(job) {
        var run = queue.then(function () { return job(); });
        queue = run.then(noop, noop);
        return run;
      }

      // adopta un estado ya sincronizado: base en memoria y copias en local y baseline
      function adopt(state) {
        baseState = state;
        local.save(state).then(noop, noop);
        baseline.save(state).then(noop, noop);
      }

      // sube un estado con su If-Match; ante un 409 fusiona con el estado vigente y
      // reintenta con el ETag nuevo, hasta 3 veces; al agotar los reintentos o si la
      // fusión no es válida, el error sale marcado y lo local queda intacto
      function upload(state) {
        var pending = state;
        var retries = 0;
        function failSync(e) {
          SYNC = 'localonly';
          if (e) e.exhausted = true;
          return Promise.reject(e);
        }
        function attempt() {
          return remote.save(pending).then(function (accepted) {
            adopt(accepted);
            SYNC = 'ok';
            return accepted;
          }, function (e) {
            if (e && e.conflict === true) {
              // la nube quedó vacía o ilegible: se reintenta tal cual contra el ETag nuevo
              if (!e.state) {
                if (retries < 3) { retries += 1; return attempt(); }
                return failSync(e);
              }
              // la nube ya tiene exactamente esto: se adopta sin otra revisión ni PUT
              if (statesEqual(e.state, pending)) {
                adopt(e.state);
                SYNC = 'ok';
                return e.state;
              }
              if (retries < 3) {
                retries += 1;
                var merged = Core.mergeStates(baseState, pending, e.state, now());
                if (merged.ok) {
                  pending = merged.state;
                  return attempt();
                }
                return failSync(new Error(merged.error || 'fusión inválida'));
              }
              return failSync(e);
            }
            SYNC = 'localonly';
            return Promise.reject(e);
          });
        }
        return attempt();
      }

      // subida en segundo plano durante la carga: su resultado solo mueve el indicador
      function enqueueUpload(state) {
        enqueue(function () { return upload(state); }).then(noop, noop);
      }

      return {
        load: function () {
          return Promise.all([
            local.load(),
            baseline.load(),
            remote.load().then(function (v) { return { ok: true, value: v }; }, function () { return { ok: false }; })
          ]).then(function (triple) {
            var localState = usableRemote(triple[0]);
            baseState = usableRemote(triple[1]);
            var r = triple[2];
            if (!r.ok) { SYNC = 'localonly'; return localState; }
            var remoteState = usableRemote(r.value);
            // remoto vacío: lo local sube como punto de partida, contra el ETag "empty"
            if (!remoteState) {
              SYNC = 'ok';
              if (localState) enqueueUpload(localState);
              return localState;
            }
            // sin copia local: la nube manda y queda de base
            if (!localState) {
              SYNC = 'ok';
              adopt(remoteState);
              return remoteState;
            }
            if (statesEqual(localState, remoteState)) {
              SYNC = 'ok';
              adopt(localState);
              return localState;
            }
            // un solo lado cambió desde la base: se conserva el otro sin fusionar
            if (baseState && statesEqual(localState, baseState)) {
              SYNC = 'ok';
              adopt(remoteState);
              return remoteState;
            }
            if (baseState && statesEqual(remoteState, baseState)) {
              SYNC = 'ok';
              enqueueUpload(localState);
              return localState;
            }
            // cambios en ambos lados: fusión a tres vías (conservadora si no hay base válida)
            var merged = Core.mergeStates(baseState, localState, remoteState, now());
            if (!merged.ok) { SYNC = 'localonly'; return localState; }
            SYNC = 'ok';
            local.save(merged.state).then(noop, noop);
            enqueueUpload(merged.state);
            return merged.state;
          });
        },
        save: function (state) {
          // lo pedido se guarda en local de inmediato: la cola del remoto nunca lo retiene;
          // la base se captura al pedir el guardado y, si otra escritura encolada la avanzó,
          // lo que se sube se reconcilia con la base nueva para no perder su fusión
          var capturedBase = baseState;
          return local.save(state).then(function () {
            return enqueue(function () {
              var pending = state;
              if (baseState && baseState !== capturedBase) {
                var rec = Core.mergeStates(capturedBase, pending, baseState, now());
                if (!rec.ok) {
                  SYNC = 'localonly';
                  var invalid = new Error(rec.error || 'fusión inválida');
                  invalid.exhausted = true;
                  throw invalid;
                }
                pending = rec.state;
              }
              return local.save(pending).then(function () {
                return upload(pending).then(function (accepted) {
                  return accepted;
                }, function (e) {
                  // conflicto sin resolver: el guardado falla y lo local queda como estaba
                  if (e && e.exhausted) throw e;
                  return pending; // remoto caído: queda en local y SYNC ya es 'localonly'
                });
              });
            });
          });
        }
      };
    }

    // elige adaptador: doble clic (file://) trabaja solo en local; servido, sincroniza
    function makeAdapter() {
      if (location.protocol === 'file:' || !location.host) { SYNC = 'off'; return LocalStorageAdapter; }
      SYNC = 'ok';
      return makeCompositeAdapter(LocalStorageAdapter, RemoteAdapter, BaselineAdapter);
    }

    // ---------- reloj y fecha que la interfaz inyecta al núcleo ----------
    // marca ISO 8601 UTC
    function now() { return new Date().toISOString(); }
    // fecha local YYYY-MM-DD
    function localDate() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    var DIAS_LARGOS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

    // 'YYYY-MM-DD' a Date local a medianoche
    function parseLocalDate(s) {
      var a = s.split('-');
      return new Date(+a[0], +a[1] - 1, +a[2]);
    }
    // rango [inicio, fin) de un día local como marcas ISO UTC
    function localDayRange(s) {
      var start = parseLocalDate(s);
      var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
      return { startIso: start.toISOString(), endIso: end.toISOString() };
    }
    // las fechas de la semana (lunes a hoy) que contiene s
    function weekUpToToday(s) {
      var d = parseLocalDate(s);
      var offset = (d.getDay() + 6) % 7;
      var out = [];
      for (var i = offset; i >= 0; i--) {
        var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
        out.push(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()));
      }
      return out;
    }
    function fmtDayName(s) { return DIAS[parseLocalDate(s).getDay()]; }
    function fmtDayDate(s) { var d = parseLocalDate(s); return d.getDate() + ' ' + MESES[d.getMonth()]; }
    function fmtHeaderDate(s) {
      var d = parseLocalDate(s);
      return DIAS_LARGOS[d.getDay()] + ' ' + d.getDate();
    }
    // marca ISO a '9 abr, 14:03'
    function fmtStamp(iso) {
      var d = new Date(iso);
      return d.getDate() + ' ' + MESES[d.getMonth()] + ', ' + d.getHours() + ':' + pad(d.getMinutes());
    }
    // marca ISO a solo la hora '14:03'
    function fmtClock(iso) {
      var d = new Date(iso);
      return d.getHours() + ':' + pad(d.getMinutes());
    }

    // ---------- estado de la aplicación ----------
    var STATE = Core.emptyState();       // única fuente de verdad
    var VIEW = { name: 'hoy' };           // vista actual y datos transitorios de interfaz
    var SAVE = 'saved';                   // 'saved' | 'saving' | 'error'
    var SYNC = 'off';                     // 'off' | 'ok' | 'localonly'
    var elapsedTimer = null;              // solo repinta el tiempo transcurrido
    var UNDO = null;                      // { state, label } del deshacer breve
    var undoTimer = null;                 // temporizador del aviso de deshacer
    var saveSeq = 0;                      // número del último guardado pedido: una respuesta vieja no pisa el indicador
    var REDUCE = false;
    try { REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    var adapter = makeAdapter();

    // calcula una fecha YYYY-MM-DD desplazada por días
    function localPlus(offset) {
      var d = new Date();
      d.setDate(d.getDate() + offset);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    // ---------- utilidades ----------
    // escapa el texto de la persona antes de insertarlo en HTML
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // texto de búsqueda comparable sin diferencias de mayúsculas ni acentos
    function foldSearch(text) {
      return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    // duración legible larga a partir de milisegundos
    function fmtDur(ms) {
      var totalMin = Math.floor(ms / 60000);
      if (totalMin < 1) return 'menos de 1 min';
      var h = Math.floor(totalMin / 60);
      var m = totalMin % 60;
      if (h < 1) return m + ' min';
      return h + ' h ' + pad(m) + ' min';
    }
    // duración compacta para las cifras de Progreso
    function fmtDurShort(ms) {
      var m = Math.floor(ms / 60000);
      if (m < 60) return m + ' min';
      var h = Math.floor(m / 60);
      var r = m % 60;
      return r ? h + ' h ' + r : h + ' h';
    }

    // texto del indicador de guardado, honesto sobre dónde quedaron los datos
    function saveText() {
      var stamp = STATE.savedAt ? ' ' + fmtClock(STATE.savedAt) : '';
      if (SYNC === 'off') {
        return SAVE === 'saving' ? 'Guardando…' : SAVE === 'error' ? 'No se pudo guardar' : ('Guardado' + stamp);
      }
      if (SAVE === 'saving') return 'Sincronizando…';
      if (SAVE === 'error') return 'No se pudo guardar';
      return SYNC === 'localonly' ? 'Guardado solo en este equipo' : ('Sincronizado' + stamp);
    }

    // busca una tarea por id para la interfaz
    function findTaskUi(id) {
      return Core.taskById(STATE, id);
    }

    // clase y palabra del resultado de una sesión, derivadas de lo que se guardó
    function outcomeKind(s) {
      if (s.nextStep === null) return 'done';
      if (s.progress === 'yes') return 'done';
      if (s.progress === 'some') return 'progress';
      return 'stuck';
    }
    function outcomeWord(s) {
      if (s.nextStep === null) return 'Terminaste la tarea';
      if (s.progress === 'yes') return 'Avanzaste bien';
      if (s.progress === 'some') return 'Avanzaste algo';
      return 'Te trabaste';
    }

    // posición de la marca sobre la línea: una pasada por hora, solo señal de que el tiempo corre (no se llena ni marca una meta)
    function tempoPos(ms) {
      return (((ms / 1000) % 3600) / 3600 * 88).toFixed(2);
    }

    // ---------- guardado ----------
    // adopta un estado nuevo, repinta y guarda solo si cambió
    function apply(next) {
      clearUndo();
      if (next === STATE) { render(); return; }
      STATE = Core.stampSave(next, now());
      SAVE = 'saving';
      render();
      var submitted = STATE;
      var seq = ++saveSeq;
      adapter.save(submitted).then(function (resolved) {
        // si el guardado devolvió una fusión y la interfaz no avanzó, se adopta esa versión
        if (resolved && typeof resolved === 'object' && STATE === submitted) {
          STATE = usableState(resolved);
          render();
        }
        if (seq === saveSeq) {
          SAVE = 'saved';
          refreshSaveIndicator();
        }
      }, function () {
        if (seq === saveSeq) {
          SAVE = 'error';
          refreshSaveIndicator();
        }
      });
    }

    // actualiza solo el indicador, sin repintar toda la vista
    function refreshSaveIndicator() {
      var el = document.getElementById('saveind');
      if (el) el.textContent = saveText();
    }

    // ---------- deshacer breve: una ventana de 10 s tras acciones destructivas ----------
    function setUndo(prevState, label) {
      UNDO = { state: prevState, label: label };
      if (undoTimer) clearTimeout(undoTimer);
      undoTimer = setTimeout(function () {
        UNDO = null;
        undoTimer = null;
        var el = document.getElementById('undobar');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 10000);
      render();
    }

    function clearUndo() {
      UNDO = null;
      if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
    }

    function doUndo() {
      if (!UNDO) return;
      var prev = UNDO.state;
      UNDO = null;
      if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
      VIEW = { name: 'hoy' };
      apply(prev);
    }

    function undoBarHtml() {
      if (!UNDO) return '';
      return '<div class="notice undobar" id="undobar"><span>' + esc(UNDO.label) + '</span>' +
        '<button type="button" class="link" data-action="undo">Deshacer</button></div>';
    }

    // ---------- acciones de interfaz ----------
    // captura el nombre sin exigir la acción y abre su campo dentro de Bandeja
    function doCapture(title) {
      var r = Core.captureTask(STATE, { title: title }, now());
      if (!r.ok) return;
      var task = r.state.tasks[r.state.tasks.length - 1];
      VIEW = { name: 'bandeja', editTaskId: task.id, focusAction: true };
      apply(r.state);
    }

    // elegir para hoy; si falta acción, se escribe en la misma tarjeta
    function doChooseForToday(taskId) {
      var r = Core.chooseForToday(STATE, { taskId: taskId, date: localDate() }, now());
      if (r.ok) { VIEW = { name: 'hoy' }; apply(r.state); return; }
      var task = findTaskUi(taskId);
      if (!task || task.nextAction) return;
      VIEW.editTaskId = taskId;
      VIEW.chooseAfterAction = true;
      VIEW.focusAction = true;
      render();
    }

    // guarda la acción desde Bandeja y elige para hoy si se pidió al abrirla
    function onSaveInlineAction() {
      var input = document.getElementById('inline-action');
      var task = findTaskUi(VIEW.editTaskId);
      if (!input || !task) return;
      var r = Core.defineTask(STATE, {
        taskId: task.id, outcome: task.outcome, nextAction: input.value
      }, now());
      if (!r.ok) {
        VIEW.actionError = r.error;
        VIEW.actionDraft = input.value;
        VIEW.focusAction = true;
        render();
        return;
      }
      var next = r.state;
      if (VIEW.chooseAfterAction) {
        var chosen = Core.chooseForToday(next, { taskId: task.id, date: localDate() }, now());
        if (chosen.ok) {
          VIEW = { name: 'hoy' };
          apply(chosen.state);
          return;
        }
      }
      var inToday = Core.todayPlan(next, localDate()).some(function (it) { return it.taskId === task.id; });
      VIEW = inToday ? { name: 'bandeja', focusCapture: true } : { name: 'bandeja', focusChooseId: task.id };
      apply(next);
    }

    // subir una tarea al primer lugar del plan de hoy
    function doMoveToFirst(taskId) {
      var r = Core.moveToFirst(STATE, { date: localDate(), taskId: taskId });
      if (r.ok) apply(r.state);
    }

    // quitar una tarea del plan de hoy y volver a Hoy
    function doRemoveFromToday(taskId) {
      var r = Core.removeFromToday(STATE, { date: localDate(), taskId: taskId });
      if (r.ok) {
        VIEW = { name: 'hoy' };
        apply(r.state);
      }
    }

    // marcar una tarea como terminada directamente y volver a Hoy
    function doMarkDone(taskId) {
      var prev = STATE;
      var r = Core.markTaskDone(STATE, { taskId: taskId }, now());
      if (r.ok) {
        VIEW = { name: 'hoy' };
        apply(r.state);
        setUndo(prev, 'Tarea terminada.');
      }
    }

    // pausar: aparta la tarea de todos los planes y vuelve a Hoy
    function doPause(id) {
      var r = Core.pauseTask(STATE, { taskId: id }, now());
      if (r.ok) {
        VIEW = { name: 'hoy' };
        apply(r.state);
      }
    }

    // reprogramar: confirma el traslado de la tarea al plan de la fecha elegida
    function onSaveReschedule() {
      var input = document.getElementById('rs-date');
      var toDate = input ? input.value : '';
      var r = Core.rescheduleTask(STATE, { taskId: VIEW.taskId, fromDate: localDate(), toDate: toDate }, now());
      if (!r.ok) {
        VIEW.rescheduleError = r.error;
        render();
        return;
      }
      VIEW = { name: 'hoy' };
      apply(r.state);
    }

    // empezar: abre una sesión y muestra la vista Sesión
    function doStart(taskId) {
      var r = Core.startSession(STATE, { taskId: taskId }, now());
      if (r.ok) { VIEW = { name: 'sesion' }; apply(r.state); }
    }

    // pausar la sesión abierta: el tiempo se congela hasta reanudar
    function doPauseSession() {
      var r = Core.pauseSession(STATE, {}, now());
      if (r.ok) apply(r.state);
    }

    // reanudar la sesión en pausa
    function doResumeSession() {
      var r = Core.resumeSession(STATE, {}, now());
      if (r.ok) apply(r.state);
    }

    // edita solo la acción; conserva el resultado que traigan tareas antiguas
    function onSaveDefine() {
      var n = document.getElementById('d-next');
      var nextAction = n ? n.value : '';
      var task = findTaskUi(VIEW.taskId);
      var r = Core.defineTask(STATE, { taskId: VIEW.taskId, outcome: task ? task.outcome : null, nextAction: nextAction }, now());
      if (!r.ok) {
        VIEW.defineError = r.error;
        VIEW.draftNext = nextAction;
        render();
        return;
      }
      VIEW = { name: VIEW.back || 'hoy' };
      apply(r.state);
    }

    // un sí o un no cierra la sesión, sin dar por terminada la tarea
    function doCloseSession(progress) {
      var r = Core.closeSession(STATE, { progress: progress, finished: false }, now());
      if (!r.ok) return;
      stopElapsed();
      VIEW = { name: 'hoy' };
      apply(r.state);
    }

    // exportar el estado como archivo JSON
    function doExport() {
      var text = Core.exportState(STATE);
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'siguiente.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // importar un archivo JSON: avisa si es más nuevo; el núcleo valida y reemplaza
    function doImport(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result);
        try {
          var parsed = JSON.parse(text);
          if (parsed && !Array.isArray(parsed) && typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > Core.SCHEMA_VERSION) {
            VIEW = { name: 'hoy', menu: true, importNewer: true };
            render();
            return;
          }
        } catch (e) {
          // el núcleo devuelve el error de JSON inválido sin modificar el estado
        }
        var r = Core.importState(STATE, text);
        if (!r.ok) { VIEW = { name: 'hoy', menu: true, importError: r.error }; render(); return; }
        VIEW = { name: 'hoy' };
        apply(r.state);
      };
      reader.onerror = function () {
        VIEW = { name: 'hoy', menu: true, importError: 'No se pudo leer el archivo.' };
        render();
      };
      reader.readAsText(file);
    }

    // borrar todo, tras confirmación
    function doDeleteAll() {
      var prev = STATE;
      stopElapsed();
      VIEW = { name: 'hoy' };
      apply(Core.emptyState());
      setUndo(prev, 'Se borraron todas las tareas y sesiones.');
    }

    // datos de ejemplo: se construyen con los mismos casos de uso
    function doLoadSample() {
      function at(dayOffset, h, m) {
        var d = new Date();
        d.setDate(d.getDate() + dayOffset);
        d.setHours(h, m, 0, 0);
        return d.toISOString();
      }
      var s = STATE;
      s = Core.captureTask(s, { title: 'Enviar la factura al cliente' }, at(-1, 9, 2)).state;
      var t1 = s.tasks[s.tasks.length - 1].id;
      s = Core.defineTask(s, { taskId: t1, outcome: 'Factura enviada y cobrada', nextAction: 'Adjuntar el PDF y escribir el correo' }, at(-1, 9, 3)).state;
      s = Core.chooseForToday(s, { taskId: t1, date: localPlus(-1) }, at(-1, 9, 4)).state;
      s = Core.startSession(s, { taskId: t1 }, at(-1, 9, 5)).state;
      s = Core.closeSession(s, { progress: 'yes', finished: true }, at(-1, 9, 40)).state;

      s = Core.captureTask(s, { title: 'Leer el capítulo 3 de historia' }, at(0, 8, 15)).state;
      var t2 = s.tasks[s.tasks.length - 1].id;
      s = Core.defineTask(s, { taskId: t2, outcome: 'Capítulo 3 leído con apuntes', nextAction: 'Leer las páginas 40 a 52' }, at(0, 8, 16)).state;
      s = Core.chooseForToday(s, { taskId: t2, date: localDate() }, at(0, 8, 17)).state;
      s = Core.startSession(s, { taskId: t2 }, at(0, 8, 30)).state;
      s = Core.pauseSession(s, {}, at(0, 8, 40)).state;
      s = Core.resumeSession(s, {}, at(0, 8, 50)).state;
      s = Core.closeSession(s, { progress: 'some', finished: false, nextStep: 'Leer las páginas 53 a 60' }, at(0, 9, 0)).state;

      s = Core.captureTask(s, { title: 'Ordenar el escritorio' }, at(0, 8, 20)).state;
      var t3 = s.tasks[s.tasks.length - 1].id;
      s = Core.defineTask(s, { taskId: t3, outcome: 'Escritorio despejado', nextAction: 'Vaciar el cajón de arriba' }, at(0, 8, 21)).state;
      s = Core.chooseForToday(s, { taskId: t3, date: localDate() }, at(0, 8, 22)).state;

      s = Core.captureTask(s, { title: 'Ideas para el regalo de mamá' }, at(0, 8, 25)).state;
      VIEW = { name: 'hoy' };
      apply(s);
    }

    // ---------- iconos: solo los dos del botón de menú; la navegación inferior es texto ----------
    var ICON = {
      menu: '<svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="4.5" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/></svg>',
      close: '<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>'
    };

    // ---------- render ----------
    function render() {
      var app = document.getElementById('app');
      var keepFocus = !VIEW.focusAction && document.activeElement && document.activeElement.id === 'capture';
      var full = (VIEW.name === 'sesion' || VIEW.name === 'cerrar') && !VIEW.menu;

      var body = VIEW.menu ? menuHtml() : viewHtml();
      if (!full && !VIEW.menu) body = undoBarHtml() + body;
      var chrome = full ? '' : (appbarHtml() + captureSlot());
      app.innerHTML = chrome + '<div class="view' + (full ? ' view--full' : '') + '">' + body + '</div>' + tabbarHtml();
      wire();

      if (keepFocus || VIEW.focusCapture) {
        var c = document.getElementById('capture');
        if (c) {
          c.focus();
          VIEW.focusCapture = false;
        }
      }
      if (VIEW.focusAction) {
        var actionInput = document.getElementById('inline-action');
        if (actionInput) {
          actionInput.focus({ preventScroll: true });
          actionInput.scrollIntoView({ block: 'center' });
        }
        VIEW.focusAction = false;
      }
      if (VIEW.focusChooseId) {
        var chooseButton = document.getElementById('choose-action');
        if (chooseButton) {
          chooseButton.focus({ preventScroll: true });
          chooseButton.scrollIntoView({ block: 'center' });
        }
        VIEW.focusChooseId = null;
      }
      if (VIEW.name === 'sesion' && !VIEW.menu) startElapsed(); else stopElapsed();
    }

    // barra superior común
    function appbarHtml() {
      var titles = { hoy: fmtHeaderDate(localDate()), bandeja: 'Bandeja', definir: 'Definir acción', ajustar: 'Ajustar', reprogramar: 'Mover de día', semana: 'Esta semana', progreso: 'Tu avance' };
      var editing = VIEW.name === 'definir' && findTaskUi(VIEW.taskId);
      var title = VIEW.menu ? 'Menú' : (editing && editing.nextAction ? 'Editar acción' : (titles[VIEW.name] || 'Siguiente'));
      return '<div class="appbar">' +
        '<div class="appbar-title"><h1>' + esc(title) + '</h1></div>' +
        '<div class="appbar-tools"><span class="saveind" id="saveind">' + esc(saveText()) + '</span>' +
        '<button type="button" class="iconbtn" data-action="toggle-menu" aria-label="' +
          (VIEW.menu ? 'Cerrar menú' : 'Menú') + '">' + (VIEW.menu ? ICON.close : ICON.menu) + '</button></div>' +
      '</div>';
    }

    // campo de captura: presente en Hoy y en Bandeja
    function captureSlot() {
      if (VIEW.menu || (VIEW.name !== 'hoy' && VIEW.name !== 'bandeja')) return '';
      return '<input id="capture" class="capture" type="text" autocomplete="off" ' +
        'placeholder="Nombre de la tarea (ej.: Física II)" aria-label="Nombre de la tarea">';
    }

    // navegación inferior de cuatro secciones
    function tabbarHtml() {
      var items = [
        ['hoy', 'Hoy'],
        ['bandeja', 'Bandeja'],
        ['semana', 'Semana'],
        ['progreso', 'Progreso']
      ];
      return '<nav class="tabbar" aria-label="Secciones">' + items.map(function (it) {
        var isCurrent = !VIEW.menu && (VIEW.name === it[0] || (it[0] === 'hoy' && (VIEW.name === 'ajustar' || (VIEW.name === 'definir' && VIEW.back === 'hoy'))));
        var current = isCurrent ? ' aria-current="page"' : '';
        return '<button type="button" class="tab" data-action="go" data-view="' + it[0] + '"' + current + '>' +
          it[1] + '</button>';
      }).join('') + '</nav>';
    }

    // enruta a la vista actual
    function viewHtml() {
      switch (VIEW.name) {
        case 'bandeja': return bandejaHtml();
        case 'definir': return definirHtml();
        case 'ajustar': return ajustarHtml();
        case 'reprogramar': return reprogramarHtml();
        case 'sesion': return sessionScreen();
        case 'cerrar': return sessionScreen();
        case 'semana': return semanaHtml();
        case 'progreso': return progresoHtml();
        default: return hoyHtml();
      }
    }

    // aviso para volver a una sesión abierta desde otra vista
    function sessionBanner() {
      var s = Core.openSession(STATE);
      if (!s || VIEW.name === 'sesion' || VIEW.name === 'cerrar') return '';
      return '<button type="button" class="notice as-button" data-action="go" data-view="sesion">' +
        (s.pausedAt
          ? 'Tienes una sesión en pausa desde las ' + esc(fmtClock(s.pausedAt)) + '. Volver a la sesión.'
          : 'Tienes una sesión abierta desde las ' + esc(fmtClock(s.startedAt)) + '. Volver a la sesión.') +
        '</button>';
    }

    // Hoy: la primera acción del plan como elemento principal, y debajo el resto
    function hoyHtml() {
      var plan = Core.todayPlan(STATE, localDate()).filter(function (it) { return it.task; });
      if (plan.length === 0) {
        return sessionBanner() +
          '<div class="empty">' +
            '<p>No has elegido nada para hoy.</p>' +
            '<button type="button" class="btn btn--quiet" data-action="go" data-view="bandeja">Ver la bandeja</button>' +
          '</div>';
      }
      var first = plan[0];
      var rest = plan.slice(1);
      var html = sessionBanner();
      html += '<section class="now">' +
        (first.task.title !== first.task.nextAction
          ? '<p class="task-context"><span>' + esc(first.task.title) + '</span></p>' : '') +
        '<p class="hero">' + esc(first.task.nextAction) + '</p>';
      if (first.task.outcome) {
        html += '<p class="for-outcome"><strong>Para:</strong> ' + esc(first.task.outcome) + '</p>';
      }
      html += '<div class="now-actions">' +
        '<button type="button" class="btn btn--primary" data-action="start" data-id="' + esc(first.task.id) + '">Empezar</button>' +
        '<button type="button" class="btn btn--text" data-action="adjust" data-id="' + esc(first.task.id) + '">Ajustar</button>' +
      '</div></section>';
      if (rest.length) {
        html += '<p class="section-label">Después</p><ul class="rows tight">';
        rest.forEach(function (it) {
          var detail = it.task.title !== it.task.nextAction ? esc(it.task.title) : '';
          if (it.task.outcome) detail += (detail ? '<br>' : '') + 'Para: ' + esc(it.task.outcome);
          html += '<li class="later"><span class="txt">' + esc(it.task.nextAction) +
            (detail ? '<span class="sub">' + detail + '</span>' : '') +
            '</span><button type="button" class="link" data-action="tofirst" data-id="' + esc(it.task.id) + '">Subir</button></li>';
        });
        html += '</ul>';
      }
      return html;
    }

    // Bandeja: tareas en inbox o active, con dos acciones por tarea
    function bandejaHtml() {
      var tasks = Core.inbox(STATE);
      var today = Core.todayPlan(STATE, localDate());
      var inToday = {};
      today.forEach(function (it) { inToday[it.taskId] = true; });

      var html = sessionBanner();
      if (tasks.length === 0) {
        return html + '<div class="empty"><p>La bandeja está vacía.<br>Escribe arriba para capturar algo.</p></div>';
      }
      html += '<ul class="rows">';
      tasks.forEach(function (t) {
        var isInbox = !t.nextAction;
        var dur = Core.taskTotalDuration(STATE, t.id);
        var editing = VIEW.editTaskId === t.id;
        html += '<li class="task' + (isInbox ? ' task--inbox' : ' task--active') +
          (editing ? ' task--captured' : '') + '">';
        html += '<div class="t-topline"><div class="t-title">' + esc(t.title) + '</div>' +
          (isInbox ? '<span class="t-tag">por definir</span>' : '') +
          '</div>';
        if (!editing && t.nextAction !== t.title) {
          html += t.nextAction
            ? '<div class="t-next">Siguiente: ' + esc(t.nextAction) + '</div>'
            : '<div class="t-next none">Sin siguiente acción</div>';
        }
        if (dur > 0) html += '<div class="t-dur">' + esc(fmtDur(dur)) + ' registrado</div>';
        if (editing) {
          if (VIEW.actionError) html += '<p class="notice">' + esc(VIEW.actionError) + '</p>';
          var actionValue = ('actionDraft' in VIEW) ? VIEW.actionDraft : (t.nextAction && t.nextAction !== t.title ? t.nextAction : '');
          html += '<label class="field" for="inline-action"><span>¿Qué harás en esta sesión?</span></label>' +
            '<input id="inline-action" class="capture" type="text" autocomplete="off" ' +
              'placeholder="Ej.: resolver problemas múltiplos de 5" value="' + esc(actionValue) + '">' +
            '<p class="action-hint">Enter para guardar</p>' +
            '<div class="t-actions"><button type="button" class="btn btn--primary btn--small" data-action="save-inline-action">' +
              (VIEW.chooseAfterAction ? 'Guardar y elegir para hoy' : 'Guardar acción') + '</button>' +
              '<button type="button" class="link" data-action="cancel-inline-action">Ahora no</button></div>';
        } else {
          html += '<div class="t-actions">' +
            '<button type="button" class="btn btn--quiet btn--small" data-action="edit-inline-action" data-id="' + esc(t.id) + '">' +
              (isInbox ? 'Escribir acción' : 'Editar acción') + '</button>' +
            (inToday[t.id]
              ? '<span class="badge">En el plan de hoy</span>'
              : '<button type="button" class="btn btn--primary btn--small" data-action="choose" data-id="' + esc(t.id) + '"' +
                (VIEW.focusChooseId === t.id ? ' id="choose-action"' : '') + '>Elegir para hoy</button>') +
            '</div>';
        }
        html += '</li>';
      });
      html += '</ul>';
      return html;
    }

    // desde Ajustar se edita la acción de Hoy sin alterar el resultado guardado
    function definirHtml() {
      var task = findTaskUi(VIEW.taskId);
      if (!task) {
        return '<div class="empty"><p>No se encontró la tarea.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="bandeja">Volver a la bandeja</button></div>';
      }
      var nextVal = ('draftNext' in VIEW) ? VIEW.draftNext : (task.nextAction || '');
      var html = '<section class="define-card">' +
        (task.title !== task.nextAction ? '<p class="define-for">' + esc(task.title) + '</p>' : '');
      if (VIEW.defineError) html += '<p class="notice">' + esc(VIEW.defineError) + '</p>';
      html += '<label class="field"><span>Siguiente acción</span>' +
        '<input id="d-next" type="text" autocomplete="off" value="' + esc(nextVal) + '"></label>';
      html += '<div class="stack">' +
        '<button type="button" class="btn btn--primary" data-action="save-define">Guardar</button>' +
        '<button type="button" class="link" data-action="cancel-define">Cancelar</button>' +
      '</div></section>';
      return html;
    }

    // opciones de ajuste para la tarea del plan de hoy
    function ajustarHtml() {
      var task = findTaskUi(VIEW.taskId);
      if (!task) {
        return '<div class="empty"><p>No se encontró la tarea.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Volver a Hoy</button></div>';
      }
      var totalMs = Core.taskTotalDuration(STATE, task.id);
      var html = '<section class="define-card">' +
        '<p class="ajustar-title">' + esc(task.title) + '</p>';
      if (task.nextAction && task.nextAction !== task.title) {
        html += '<p class="ajustar-note"><strong>Siguiente acción:</strong> ' + esc(task.nextAction) + '</p>';
      }
      if (task.outcome) {
        html += '<p class="ajustar-note"><strong>Para:</strong> ' + esc(task.outcome) + '</p>';
      }
      if (totalMs > 0) {
        html += '<p class="ajustar-note ajustar-note--faint">Tiempo acumulado: ' + esc(fmtDur(totalMs)) + '</p>';
      }
      html += '<div class="stack">' +
        '<button type="button" class="btn btn--quiet" data-action="adjust-edit" data-id="' + esc(task.id) + '">Editar acción</button>' +
        '<button type="button" class="btn btn--quiet" data-action="adjust-remove" data-id="' + esc(task.id) + '">Quitar del plan de hoy</button>' +
        '<button type="button" class="btn btn--quiet" data-action="adjust-pause" data-id="' + esc(task.id) + '">Pausar esta tarea</button>' +
        '<button type="button" class="btn btn--quiet" data-action="adjust-reschedule" data-id="' + esc(task.id) + '">Mover a otro día…</button>' +
        '<button type="button" class="btn btn--quiet" data-action="adjust-done" data-id="' + esc(task.id) + '">Marcar tarea como terminada</button>' +
        '<button type="button" class="link" data-action="go" data-view="hoy">Volver a Hoy</button>' +
      '</div></section>';
      return html;
    }

    // reprogramar: elegir a qué día se mueve la tarea del plan de hoy
    function reprogramarHtml() {
      var task = findTaskUi(VIEW.taskId);
      if (!task) {
        return '<div class="empty"><p>No se encontró la tarea.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Volver a Hoy</button></div>';
      }
      // la interfaz calcula mañana en fecha local; el núcleo nunca decide qué día es hoy
      var d = new Date();
      d.setDate(d.getDate() + 1);
      var manana = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      var html = '<section class="define-card">' +
        '<p class="ajustar-title">' + esc(task.title) + '</p>' +
        '<p class="ajustar-note">Cambias el día en que vas a trabajarla; su fecha límite no se toca.</p>';
      if (VIEW.rescheduleError) {
        html += '<p class="notice">' + esc(VIEW.rescheduleError) + '</p>';
      }
      html += '<label class="field"><span>Día al que pasa</span>' +
        '<input id="rs-date" type="date" value="' + esc(manana) + '"></label>' +
        '<div class="stack">' +
        '<button type="button" class="btn btn--primary" data-action="reschedule-save">Mover a ese día</button>' +
        '<button type="button" class="link" data-action="adjust" data-id="' + esc(task.id) + '">Cancelar</button>' +
        '</div></section>';
      return html;
    }

    // pantalla de sesión: en curso o en cierre
    function sessionScreen() {
      var s = Core.openSession(STATE);
      if (!s) {
        return '<div class="empty"><p>No hay ninguna sesión abierta.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Ir a Hoy</button></div>';
      }
      return VIEW.name === 'cerrar' ? cerrarHtml() : sesionHtml(s);
    }

    // sesión en curso: acción, tiempo transcurrido con su barra, pausa y cierre
    function sesionHtml(s) {
      var task = findTaskUi(s.taskId);
      var ms = Core.sessionDuration(s, now());
      var paused = !!s.pausedAt;
      var html = '<div class="session">';
      if (VIEW.reentry) {
        html += '<p class="notice">Sesión abierta desde el ' + esc(fmtStamp(s.startedAt)) + '.</p>';
      }
      html += '<div class="session-top">' +
        (task && task.title !== task.nextAction
          ? '<p class="task-context"><span>' + esc(task.title) + '</span></p>' : '');
      html += '<p class="hero">' + esc(task ? task.nextAction : '(tarea no encontrada)') + '</p>';
      if (task && task.outcome) {
        html += '<p class="for-outcome">Para: ' + esc(task.outcome) + '</p>';
      }
      html += '</div><div class="tempo-stage' + (paused ? ' is-paused' : '') + '">' +
        '<strong class="tempo-time" id="elapsed">' + esc(fmtDur(ms)) + '</strong>' +
        '<div class="tempo" aria-hidden="true"><div class="tempo-fill" style="left:' + tempoPos(ms) + '%"></div></div>' +
        (paused
          ? '<p class="tempo-note">en pausa desde las ' + esc(fmtClock(s.pausedAt)) + '</p>'
          : '<p class="tempo-note">desde las ' + esc(fmtClock(s.startedAt)) + '</p>') +
      '</div>';
      html += '<div class="session-end">' +
        '<button type="button" class="btn btn--primary" data-action="finish">Listo</button>' +
        '<button type="button" class="btn btn--quiet" data-action="session-pause-toggle">' + (paused ? 'Reanudar' : 'Pausar') + '</button>' +
      '</div>';
      html += '</div>';
      return html;
    }

    // cierre rápido: la respuesta guarda el resultado y conserva la acción vigente
    function cerrarHtml() {
      return '<div class="session"><section class="close-card">' +
        '<p class="kicker">Cerrar la sesión</p><p class="q">¿Avanzaste?</p>' +
        '<div class="results">' +
          '<button type="button" class="result" data-action="cl-progress" data-value="yes">Sí</button>' +
          '<button type="button" class="result" data-action="cl-progress" data-value="no">No</button>' +
        '</div>' +
        '<div class="stack"><button type="button" class="link" data-action="cl-cancel">Volver a la sesión</button></div>' +
        '</section></div>';
    }

    // Semana: lo que trabajaste, de lunes a hoy; un día vacío es solo un día vacío
    function semanaHtml() {
      var today = localDate();
      var days = weekUpToToday(today);
      var banner = sessionBanner();

      // datos de cada día: sesiones cerradas y, solo hoy, lo que queda en el plan
      var perDay = days.map(function (ds) {
        var range = localDayRange(ds);
        var sessions = Core.sessionsBetween(STATE, range.startIso, range.endIso);
        var planned = [];
        if (ds === today) {
          var already = {};
          sessions.forEach(function (x) { already[x.taskId] = true; });
          Core.todayPlan(STATE, today).forEach(function (it) {
            if (it.task && !already[it.taskId]) planned.push(it.task);
          });
        }
        return { ds: ds, sessions: sessions, planned: planned };
      });

      var range = days.length === 1 ? 'Esta semana: ' + fmtDayDate(today)
        : 'Del ' + fmtDayDate(days[0]) + ' al ' + fmtDayDate(today);
      var html = banner + '<p class="week-range">' + esc(range) + '</p>';
      var hasData = perDay.some(function (d) { return d.sessions.length || d.planned.length; });
      if (!hasData) {
        return html + '<div class="empty">' +
          '<p>Todavía no has trabajado ninguna sesión esta semana.<br>Cuando cierres una, aparecerá aquí por día.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Ir a Hoy</button></div>';
      }

      html += '<div class="week-stack">';
      perDay.forEach(function (d) {
        html += '<section class="day' + (d.ds === today ? ' today' : '') + '">' +
          '<h2 class="day-head"><span class="d-name">' + esc(fmtDayName(d.ds)) + '</span>' +
          '<span class="d-date">' + esc(fmtDayDate(d.ds)) + '</span>' +
          (d.ds === today ? '<span class="d-today">Hoy</span>' : '') + '</h2><div class="day-body">';
        if (d.sessions.length) {
          html += '<p class="d-total">' + esc(fmtDur(Core.sessionsTotalDuration(d.sessions, null))) + ' registrados</p>' +
            '<ul class="day-items">';
          d.sessions.forEach(function (x) {
            var t = Core.taskById(STATE, x.taskId);
            html += '<li class="d-item"><span class="d-time">' + esc(fmtClock(x.startedAt)) + '</span>' +
              '<span class="d-task">' + esc(t ? t.title : '(tarea eliminada)') + '</span>' +
              '<span class="d-dur">' + esc(fmtDur(Core.sessionDuration(x, x.endedAt))) + '</span></li>';
          });
          html += '</ul>';
        } else if (!d.planned.length) {
          html += '<p class="day-empty">Sin sesiones</p>';
        }
        if (d.planned.length) {
          html += '<div class="day-plan"><p class="day-plan-label">En el plan de hoy</p><ul class="day-items">';
          d.planned.forEach(function (t) {
            html += '<li class="d-item"><span class="d-task">' + esc(t.nextAction) + '</span></li>';
          });
          html += '</ul></div>';
        }
        html += '</div></section>';
      });
      return html + '</div>';
    }

    // Progreso: cifras globales y registro acotado por mes y búsqueda
    function progresoHtml() {
      var stats = Core.sessionStats(STATE);
      var log = Core.closedSessions(STATE);
      var html = sessionBanner();

      html += '<section class="panel" aria-label="Resumen de todo el registro">' +
        '<p class="panel-note">Desde el inicio</p><div class="figures">' +
        '<div class="figure"><strong>' + stats.count + '</strong><span>Sesiones</span></div>' +
        '<div class="figure"><strong>' + esc(fmtDurShort(stats.totalMs)) + '</strong><span>Tiempo registrado</span></div>' +
        '<div class="figure"><strong>' + stats.completedTasks + '</strong><span>Tareas terminadas</span></div>' +
      '</div></section>';

      if (log.length === 0) {
        html += '<div class="empty"><p>Cuando cierres tu primera sesión aparecerá aquí.<br>El registro no se borra nunca.</p></div>';
        return html;
      }

      VIEW.logMonth = VIEW.logMonth || localDate().slice(0, 7);
      var month = VIEW.logMonth;
      var monthLabel = new Intl.DateTimeFormat('es', { month: 'long', year: 'numeric' })
        .format(parseLocalDate(month + '-01'));
      var query = foldSearch((VIEW.logQuery || '').trim());
      var filtered = log.filter(function (x) {
        var started = new Date(x.startedAt);
        var sessionMonth = started.getFullYear() + '-' + pad(started.getMonth() + 1);
        if (sessionMonth !== month) return false;
        var t = Core.taskById(STATE, x.taskId);
        return foldSearch([t ? t.title : '', outcomeWord(x), x.nextStep || ''].join(' ')).includes(query);
      });
      html += '<p class="section-label">Registro</p>' +
        '<div class="log-controls"><div class="log-month">' +
            '<button type="button" class="log-month-btn" data-action="log-prev" aria-label="Mes anterior">‹</button>' +
            '<span aria-live="polite">' + esc(monthLabel) + '</span>' +
            '<button type="button" class="log-month-btn" data-action="log-next" aria-label="Mes siguiente">›</button></div>' +
          '<input id="log-search" class="log-search" type="search" autocomplete="off" ' +
            'placeholder="Buscar en el registro" aria-label="Buscar en el registro" value="' + esc(VIEW.logQuery || '') + '"></div>' +
        '<ul class="log" data-month="' + esc(monthLabel) + '">';
      filtered.forEach(function (x) {
        var t = Core.taskById(STATE, x.taskId);
        html += '<li><div class="log-head">' +
          '<span>' + esc(fmtStamp(x.startedAt)) + '</span>' +
          '<span class="l-task">' + esc(t ? t.title : '(tarea eliminada)') + '</span>' +
          '<span class="l-dur">' + esc(fmtDur(Core.sessionDuration(x, x.endedAt))) + '</span>' +
        '</div>' +
        '<div class="log-outcome"><span class="dot dot--' + outcomeKind(x) + '"></span><span>' + esc(outcomeWord(x)) + '</span></div>' +
        (x.nextStep ? '<span class="log-step">Siguiente: ' + esc(x.nextStep) + '</span>' : '') +
        '</li>';
      });
      html += '</ul>';
      if (!filtered.length) html += '<p class="log-empty">No hay sesiones que coincidan en este mes.</p>';
      return html;
    }

    // menú: exportar, importar, borrar todo y una nota de sincronización
    function menuHtml() {
      var html = '<section class="menu-card">';
      if (VIEW.importNewer) {
        html += '<p class="notice">Este archivo es de una versión más nueva de Siguiente. Actualiza la app antes de importarlo.</p>';
      } else if (VIEW.importError) {
        html += '<p class="notice">No se pudo importar: ' + esc(VIEW.importError) + '</p>';
      }
      html += '<div class="stack">';
      html += '<button type="button" class="btn btn--quiet" data-action="export">Exportar</button>';
      html += '<label class="btn btn--quiet filelabel">Importar' +
        '<input id="importfile" type="file" accept="application/json,.json"></label>';
      if (!VIEW.confirmWipe) {
        html += '<button type="button" class="btn btn--quiet" data-action="wipe-ask">Borrar todo</button>';
      } else {
        html += '<p class="notice">Esto borra todas las tareas y sesiones. No se puede deshacer.</p>';
        html += '<button type="button" class="btn btn--primary" data-action="wipe-yes">Sí, borrar todo</button>';
        html += '<button type="button" class="link" data-action="wipe-no">Cancelar</button>';
      }
      html += '</div>';
      if (STATE.tasks.length === 0 && STATE.sessions.length === 0) {
        html += '<p class="section-label">Datos de ejemplo</p>';
        html += '<p class="notice">Carga unas tareas y sesiones de muestra para ver la app en marcha. ' +
          'Puedes borrarlas después con "Borrar todo".</p>';
        html += '<div class="stack"><button type="button" class="btn btn--quiet" data-action="sample">Cargar datos de ejemplo</button></div>';
      }
      if (SYNC !== 'off') {
        var hasToken = !!syncToken();
        html += '<p class="section-label">Sincronización</p>';
        html += '<p class="notice">' + (SYNC === 'localonly'
          ? 'Ahora mismo se guarda solo en este equipo. Se volverá a sincronizar cuando haya conexión.'
          : 'Los cambios se sincronizan con tu espacio en la nube.') + '</p>';
        html += '<div class="stack">' +
          '<label class="field"><span>' +
            (hasToken ? 'Cambiar el token de acceso' : 'Token de acceso (déjalo vacío si la URL no lo pide)') +
          '</span><input id="synctoken" type="password" autocomplete="off" placeholder="' +
            (hasToken ? 'hay un token guardado' : 'pega aquí el token') + '"></label>' +
          '<button type="button" class="btn btn--quiet" data-action="save-token">Guardar token</button>' +
          (hasToken ? '<button type="button" class="link" data-action="clear-token">Quitar el token de este equipo</button>' : '') +
        '</div>';
      }
      html += '</section>';
      return html;
    }

    // ---------- eventos ----------
    function wire() {
      var actionInput = document.getElementById('inline-action');
      if (actionInput) {
        actionInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); onSaveInlineAction(); }
        });
      }
      var cap = document.getElementById('capture');
      if (cap) {
        cap.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var value = cap.value;
          cap.value = '';
          doCapture(value);
        });
      }
      var search = document.getElementById('log-search');
      if (search) {
        search.addEventListener('input', function () {
          var start = search.selectionStart;
          var end = search.selectionEnd;
          VIEW.logQuery = search.value;
          render();
          var next = document.getElementById('log-search');
          if (next) { next.focus(); next.setSelectionRange(start, end); }
        });
      }
      var imp = document.getElementById('importfile');
      if (imp) {
        imp.addEventListener('change', function () {
          if (imp.files && imp.files[0]) doImport(imp.files[0]);
        });
      }
    }

    // clic delegado sobre el contenedor
    function onClick(e) {
      var btn = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      var id = btn.getAttribute('data-id');
      var view = btn.getAttribute('data-view');
      var value = btn.getAttribute('data-value');

      if (action === 'go') {
        VIEW = { name: view };
        render();
      } else if (action === 'log-prev' || action === 'log-next') {
        var month = parseLocalDate(VIEW.logMonth + '-01');
        month.setMonth(month.getMonth() + (action === 'log-prev' ? -1 : 1));
        VIEW.logMonth = month.getFullYear() + '-' + pad(month.getMonth() + 1);
        render();
      } else if (action === 'toggle-menu') {
        VIEW.menu = !VIEW.menu;
        VIEW.confirmWipe = false;
        VIEW.importError = null;
        VIEW.importNewer = false;
        render();
      } else if (action === 'edit-inline-action') {
        VIEW = { name: 'bandeja', editTaskId: id, focusAction: true };
        render();
      } else if (action === 'save-inline-action') {
        onSaveInlineAction();
      } else if (action === 'cancel-inline-action') {
        VIEW = { name: 'bandeja' };
        render();
      } else if (action === 'choose') {
        doChooseForToday(id);
      } else if (action === 'adjust') {
        VIEW = { name: 'ajustar', taskId: id };
        render();
      } else if (action === 'adjust-edit') {
        VIEW = { name: 'definir', taskId: id, back: 'hoy', choose: false };
        render();
      } else if (action === 'adjust-remove') {
        doRemoveFromToday(id);
      } else if (action === 'adjust-done') {
        doMarkDone(id);
      } else if (action === 'adjust-pause') {
        doPause(id);
      } else if (action === 'adjust-reschedule') {
        VIEW = { name: 'reprogramar', taskId: id, rescheduleError: null };
        render();
      } else if (action === 'reschedule-save') {
        onSaveReschedule();
      } else if (action === 'start') {
        doStart(id);
      } else if (action === 'tofirst') {
        doMoveToFirst(id);
      } else if (action === 'save-define') {
        onSaveDefine();
      } else if (action === 'cancel-define') {
        VIEW = { name: VIEW.back || 'hoy' };
        render();
      } else if (action === 'finish') {
        VIEW = { name: 'cerrar' };
        render();
      } else if (action === 'cl-progress') {
        doCloseSession(value);
      } else if (action === 'cl-cancel') {
        VIEW = { name: 'sesion' };
        render();
      } else if (action === 'export') {
        doExport();
      } else if (action === 'wipe-ask') {
        VIEW.confirmWipe = true;
        render();
      } else if (action === 'wipe-yes') {
        doDeleteAll();
      } else if (action === 'wipe-no') {
        VIEW.confirmWipe = false;
        render();
      } else if (action === 'save-token') {
        var tk = document.getElementById('synctoken');
        if (tk && tk.value.trim()) {
          setSyncToken(tk.value);
          VIEW = { name: 'hoy' };
          // recarga con el nuevo token para traer lo que ya haya en la nube
          adapter.load().then(function (loaded) {
            STATE = usableState(loaded);
            SAVE = 'saved';
            render();
          }, function () { render(); });
        } else {
          render();
        }
      } else if (action === 'session-pause-toggle') {
        var s = Core.openSession(STATE);
        if (s) {
          if (s.pausedAt) doResumeSession(); else doPauseSession();
        }
      } else if (action === 'undo') {
        doUndo();
      } else if (action === 'sample') {
        doLoadSample();
      } else if (action === 'clear-token') {
        setSyncToken('');
        render();
      }
    }

    // ---------- tiempo transcurrido: el intervalo solo repinta, nunca cuenta ni guarda ----------
    function startElapsed() {
      stopElapsed();
      tickElapsed();
      elapsedTimer = setInterval(tickElapsed, 1000);
    }
    function tickElapsed() {
      var s = Core.openSession(STATE);
      var el = document.getElementById('elapsed');
      if (!s || !el) { stopElapsed(); return; }
      if (s.pausedAt) return;
      var ms = Core.sessionDuration(s, now());
      el.textContent = fmtDur(ms);
      if (!REDUCE) {
        var fill = document.querySelector('.tempo-fill');
        if (fill) fill.style.left = tempoPos(ms) + '%';
      }
    }
    function stopElapsed() {
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    }

    // ---------- arranque ----------
    // normaliza lo cargado a un estado usable
    function usableState(loaded) {
      return (loaded && typeof loaded === 'object' && !Array.isArray(loaded))
        ? Core.migrate(loaded)
        : Core.emptyState();
    }

    function init() {
      document.getElementById('app').addEventListener('click', onClick);
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          if (e.key === 'Escape') e.target.blur();
          return;
        }
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var k = e.key;
        if (k === 'n') {
          if (VIEW.name === 'cerrar') return;
          e.preventDefault();
          var capture = document.getElementById('capture');
          if (capture) capture.focus();
          else { VIEW = { name: 'hoy', focusCapture: true }; render(); }
        } else if (k === '/') {
          e.preventDefault();
          var c = document.getElementById('capture');
          if (c) c.focus();
        } else if (k === 'Escape') {
          if (VIEW.name !== 'hoy' || VIEW.menu) {
            VIEW = { name: 'hoy' };
            render();
          }
        } else if (k === ' ' && VIEW.name === 'hoy') {
          var plan = Core.todayPlan(STATE, localDate()).filter(function (it) { return it.task; });
          if (plan.length) {
            e.preventDefault();
            doStart(plan[0].task.id);
          }
        } else if (k === 'p' && VIEW.name === 'sesion') {
          var s = Core.openSession(STATE);
          if (s) {
            if (s.pausedAt) doResumeSession(); else doPauseSession();
          }
        }
      });
      adapter.load().then(function (loaded) {
        STATE = usableState(loaded);
        SAVE = 'saved';
        VIEW = Core.openSession(STATE) ? { name: 'sesion', reentry: true } : { name: 'hoy' };
        render();
      }, function () {
        STATE = Core.emptyState();
        SAVE = 'saved';
        VIEW = { name: 'hoy' };
        render();
      });
    }

    init();
  })();
  </script>
</body>
</html>
