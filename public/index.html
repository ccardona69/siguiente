<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#17150F">
  <title>Siguiente</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17150F;
      --surface: #211E16;
      --surface-2: #2B271D;
      --text: #EDE6D6;
      --text-dim: #A69E8B;
      --text-faint: #726B5A;
      --line: #332F24;
      --accent: #F0B429;
      --accent-ink: #1A1710;
      --done: #8FB48A;
      --progress: #E0A458;
      --stuck: #B99A8C;
      --radius: 10px;
      --radius-lg: 14px;
      --maxw: 30rem;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 20px 20px calc(96px + env(safe-area-inset-bottom));
    }
    ::selection { background: rgba(240, 180, 41, .22); }

    /* barra superior: título de la vista, estado de guardado y menú */
    .appbar { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .appbar h1 { margin: 0 auto 0 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .saveind { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
    .iconbtn {
      flex: none; display: grid; place-items: center;
      width: 36px; height: 36px; margin-right: -8px;
      border: 0; border-radius: var(--radius); background: transparent;
      color: var(--text-dim); cursor: pointer;
    }
    .iconbtn:hover { color: var(--text); }
    .iconbtn svg { width: 20px; height: 20px; }

    /* captura: solo el título es obligatorio, nada bloquea */
    .capture {
      width: 100%; padding: 13px 14px; margin-bottom: 24px;
      font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .capture::placeholder { color: var(--text-faint); }

    /* botones */
    .btn {
      display: block; width: 100%; min-height: 44px; padding: 12px 18px;
      font: 500 16px/1.2 var(--font); text-align: center;
      border: 1px solid transparent; border-radius: var(--radius); cursor: pointer;
    }
    .btn--primary { background: var(--accent); color: var(--accent-ink); }
    .btn--quiet { background: transparent; color: var(--text); border-color: var(--line); }
    .btn--small { width: auto; min-height: 0; padding: 9px 14px; font-size: 14px; }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

    .link {
      border: 0; background: transparent; color: var(--text-dim);
      font: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
      padding: 6px 0; cursor: pointer;
    }
    .link:hover { color: var(--text); }

    /* Hoy: la acción actual es el elemento principal de toda la app */
    .kicker { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--text-faint); }
    .hero { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
    .for-outcome { margin: 10px 0 0; color: var(--text-dim); font-size: 15px; }

    /* listas planas, separadas por filete (después, bandeja, registro) */
    .rows { list-style: none; margin: 26px 0 0; padding: 0; }
    .rows.tight { margin-top: 6px; }
    .rows > li { padding: 14px 0; border-top: 1px solid var(--line); }
    .rows > li:first-child { border-top: 0; }
    .section-label { margin: 30px 0 0; font-size: 13px; font-weight: 600; color: var(--text-dim); }

    .later { display: flex; gap: 14px; align-items: baseline; justify-content: space-between; }
    .later .txt { flex: 1; }
    .later .sub { display: block; margin-top: 2px; color: var(--text-faint); font-size: 13px; }

    /* bandeja */
    .task .t-title { font-weight: 500; }
    .task .t-next { margin-top: 3px; color: var(--text-dim); font-size: 14px; }
    .task .t-next.none { color: var(--text-faint); }
    .task .t-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .badge { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--text-dim); }

    /* formularios */
    .field { display: block; margin-top: 16px; }
    .field span { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-dim); }
    .field input {
      width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .define-for { margin: 0; color: var(--text-dim); }
    .q { margin: 0 0 4px; font-size: 19px; font-weight: 600; }

    /* aviso neutro: sin color de alerta, nunca culpa */
    .notice {
      margin: 0 0 18px; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      color: var(--text-dim); font-size: 14px; line-height: 1.45;
    }
    .notice.as-button { width: 100%; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; }

    /* panel elevado: se usa poco, solo en Progreso */
    .panel {
      margin-top: 4px; padding: 16px 18px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    }
    .figures { display: flex; }
    .figure { flex: 1; padding: 2px 14px; }
    .figure:first-child { padding-left: 0; }
    .figure + .figure { border-left: 1px solid var(--line); }
    .figure strong { display: block; font-size: 23px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .figure span { display: block; margin-top: 4px; color: var(--text-dim); font-size: 12px; }

    /* sesión: pantalla enfocada, el tiempo cuenta hacia arriba desde la marca de inicio */
    .view--full { padding-top: 6px; }
    .session .hero { font-size: 26px; }
    .ring-stage { display: grid; place-items: center; padding: 34px 0 28px; }
    .ring-wrap { position: relative; width: 208px; height: 208px; }
    .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--line); stroke-width: 2.5; }
    .ring-sweep {
      fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 289.03; stroke-dashoffset: 289.03;
    }
    .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-label strong { font-size: 42px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .ring-label span { display: block; margin-top: 6px; color: var(--text-dim); font-size: 13px; }

    /* resultado de la sesión */
    .results { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .result {
      display: block; width: 100%; min-height: 48px; padding: 13px 15px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
      font: 500 15px/1.2 var(--font); color: var(--text); text-align: left; cursor: pointer;
    }

    /* semana: registro retrospectivo, un día sin sesiones no es un incumplimiento */
    .day { padding: 16px 0; border-top: 1px solid var(--line); }
    .day:first-child { border-top: 0; }
    .day-head { display: flex; align-items: baseline; gap: 8px; }
    .day-head .d-name { font-weight: 600; font-size: 14px; text-transform: capitalize; }
    .day-head .d-date { color: var(--text-faint); font-size: 12px; }
    .day.today .d-name { color: var(--accent); }
    .day-items { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .day-empty { margin: 8px 0 0; color: var(--text-faint); font-size: 13px; }
    .d-item { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
    .d-item .d-dur { margin-left: auto; color: var(--text-faint); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .d-item.planned { color: var(--text-dim); }
    .d-item.planned .tag { margin-left: auto; color: var(--text-faint); font-size: 12px; white-space: nowrap; }

    /* registro completo: se conserva siempre */
    .log { list-style: none; margin: 6px 0 0; padding: 0; }
    .log > li { padding: 13px 0; border-top: 1px solid var(--line); }
    .log > li:first-child { border-top: 0; }
    .log-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; color: var(--text-faint); }
    .log-head .l-task { color: var(--text); font-weight: 500; }
    .log-head .l-dur { margin-left: auto; font-variant-numeric: tabular-nums; }
    .log-outcome { display: flex; gap: 8px; align-items: baseline; margin: 7px 0 0; font-size: 13px; color: var(--text-dim); }
    .log-step { display: block; margin: 3px 0 0 15px; color: var(--text-faint); font-size: 13px; }
    .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; transform: translateY(-1px); }
    .dot--done { background: var(--done); }
    .dot--progress { background: var(--progress); }
    .dot--stuck { background: var(--stuck); }

    /* estado vacío: una invitación a actuar, sin presión */
    .empty { padding: 40px 0 24px; text-align: center; color: var(--text-dim); }
    .empty p { margin: 0 0 18px; }

    /* menú */
    .filelabel { position: relative; overflow: hidden; }
    .filelabel input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* navegación inferior */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: var(--maxw);
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--bg); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      position: relative; display: grid; place-items: center; gap: 3px;
      min-height: 58px; padding: 8px 4px;
      border: 0; background: transparent; color: var(--text-faint);
      font: 500 11px/1 var(--font); cursor: pointer;
    }
    .tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tab[aria-current="page"] { color: var(--accent); }
    .tab[aria-current="page"]::before {
      content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 2px;
      background: var(--accent); border-radius: 0 0 2px 2px;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .capture:focus-visible, .field input:focus-visible { outline-offset: 1px; }

    @media (prefers-reduced-motion: no-preference) {
      .btn:active, .result:active { transform: translateY(1px); }
      .tab { transition: color .12s ease; }
    }
    @media (min-width: 32rem) {
      #app { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script src="core.js"></script>
  <script>
  (function () {
    'use strict';

    var Core = globalThis.SiguienteCore;

    // ---------- adaptador local: única puerta a la persistencia del navegador ----------
    var LocalStorageAdapter = {
      key: 'siguiente.v1',
      load: function () {
        var key = this.key;
        return new Promise(function (resolve) {
          try {
            var raw = localStorage.getItem(key);
            resolve(raw ? JSON.parse(raw) : null);
          } catch (e) {
            resolve(null);
          }
        });
      },
      save: function (state) {
        var key = this.key;
        return new Promise(function (resolve, reject) {
          try {
            localStorage.setItem(key, JSON.stringify(state));
            resolve();
          } catch (e) {
            reject(e);
          }
        });
      }
    };

    // ---------- adaptador remoto: guarda y devuelve el estado completo contra el Worker ----------
    // la ruta es relativa; solo funciona cuando la app se sirve desde su propio origen
    var SYNC_PATH = '/api/state';

    // token de sincronización guardado solo en este equipo; nunca viaja en la URL
    function syncToken() {
      try {
        return localStorage.getItem('siguiente.token') || '';
      } catch (e) {
        return '';
      }
    }
    function setSyncToken(value) {
      var t = String(value == null ? '' : value).trim();
      try {
        if (t) localStorage.setItem('siguiente.token', t);
        else localStorage.removeItem('siguiente.token');
      } catch (e) {}
    }

    // cabeceras de autorización solo si hay token configurado
    function authHeaders() {
      var t = syncToken();
      return t ? { 'Authorization': 'Bearer ' + t } : {};
    }

    var RemoteAdapter = {
      load: function () {
        return fetch(SYNC_PATH, { headers: authHeaders(), cache: 'no-store' }).then(function (res) {
          if (!res.ok) throw new Error('estado remoto no disponible');
          return res.json();
        }).then(function (body) {
          return body && body.state ? body.state : null;
        });
      },
      save: function (state) {
        return fetch(SYNC_PATH, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify(state)
        }).then(function (res) {
          if (!res.ok) throw new Error('no se pudo guardar en el servidor');
        });
      }
    };

    function noop() {}
    function revisionOf(s) { return (s && typeof s.revision === 'number') ? s.revision : -1; }

    // ---------- adaptador compuesto: local nunca pierde datos, remoto sincroniza si puede ----------
    // respeta el mismo contrato load()/save(state); ni el núcleo ni las vistas lo notan
    function makeCompositeAdapter(local, remote) {
      return {
        load: function () {
          return Promise.all([
            local.load(),
            remote.load().then(function (v) { return { ok: true, value: v }; }, function () { return { ok: false }; })
          ]).then(function (pair) {
            var localState = pair[0];
            var r = pair[1];
            if (!r.ok) { SYNC = 'localonly'; return localState; }
            SYNC = 'ok';
            var remoteState = r.value;
            // remoto vacío: se sube lo local como punto de partida
            if (!remoteState) {
              if (localState) remote.save(localState).then(noop, function () { SYNC = 'localonly'; });
              return localState;
            }
            // lo local va por delante (cambios sin sincronizar): se sube y se conserva
            if (localState && revisionOf(localState) > revisionOf(remoteState)) {
              remote.save(localState).then(noop, function () { SYNC = 'localonly'; });
              return localState;
            }
            // el remoto manda: se cachea en local
            local.save(remoteState).then(noop, noop);
            return remoteState;
          });
        },
        save: function (state) {
          return local.save(state).then(function () {
            return remote.save(state).then(function () { SYNC = 'ok'; }, function () { SYNC = 'localonly'; });
          });
        }
      };
    }

    // elige adaptador: doble clic (file://) trabaja solo en local; servido, sincroniza
    function makeAdapter() {
      if (location.protocol === 'file:' || !location.host) { SYNC = 'off'; return LocalStorageAdapter; }
      SYNC = 'ok';
      return makeCompositeAdapter(LocalStorageAdapter, RemoteAdapter);
    }

    // ---------- reloj y fecha que la interfaz inyecta al núcleo ----------
    // marca ISO 8601 UTC
    function now() { return new Date().toISOString(); }
    // fecha local YYYY-MM-DD
    function localDate() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

    // 'YYYY-MM-DD' a Date local a medianoche
    function parseLocalDate(s) {
      var a = s.split('-');
      return new Date(+a[0], +a[1] - 1, +a[2]);
    }
    // rango [inicio, fin) de un día local como marcas ISO UTC
    function localDayRange(s) {
      var start = parseLocalDate(s);
      var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
      return { startIso: start.toISOString(), endIso: end.toISOString() };
    }
    // las fechas de la semana (lunes a hoy) que contiene s
    function weekUpToToday(s) {
      var d = parseLocalDate(s);
      var offset = (d.getDay() + 6) % 7;
      var out = [];
      for (var i = offset; i >= 0; i--) {
        var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
        out.push(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()));
      }
      return out;
    }
    function fmtDayName(s) { return DIAS[parseLocalDate(s).getDay()]; }
    function fmtDayDate(s) { var d = parseLocalDate(s); return d.getDate() + ' ' + MESES[d.getMonth()]; }
    // marca ISO a '9 abr, 14:03'
    function fmtStamp(iso) {
      var d = new Date(iso);
      return d.getDate() + ' ' + MESES[d.getMonth()] + ', ' + d.getHours() + ':' + pad(d.getMinutes());
    }
    // marca ISO a solo la hora '14:03'
    function fmtClock(iso) {
      var d = new Date(iso);
      return d.getHours() + ':' + pad(d.getMinutes());
    }

    // ---------- estado de la aplicación ----------
    var STATE = Core.emptyState();       // única fuente de verdad
    var VIEW = { name: 'hoy' };           // vista actual y datos transitorios de interfaz
    var SAVE = 'saved';                   // 'saved' | 'saving' | 'error'
    var SYNC = 'off';                     // 'off' | 'ok' | 'localonly'
    var elapsedTimer = null;              // solo repinta el tiempo transcurrido
    var REDUCE = false;
    try { REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    var adapter = makeAdapter();

    // ---------- utilidades ----------
    // escapa el texto de la persona antes de insertarlo en HTML
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // duración legible larga a partir de milisegundos
    function fmtDur(ms) {
      var totalMin = Math.floor(ms / 60000);
      if (totalMin < 1) return 'menos de 1 min';
      var h = Math.floor(totalMin / 60);
      var m = totalMin % 60;
      if (h < 1) return m + ' min';
      return h + ' h ' + pad(m) + ' min';
    }
    // duración compacta para las cifras de Progreso
    function fmtDurShort(ms) {
      var m = Math.floor(ms / 60000);
      if (m < 60) return m + ' min';
      var h = Math.floor(m / 60);
      var r = m % 60;
      return r ? h + ' h ' + r : h + ' h';
    }

    // texto del indicador de guardado, honesto sobre dónde quedaron los datos
    function saveText() {
      if (SYNC === 'off') {
        return SAVE === 'saving' ? 'Guardando…' : SAVE === 'error' ? 'No se pudo guardar' : 'Guardado';
      }
      if (SAVE === 'saving') return 'Sincronizando…';
      if (SAVE === 'error') return 'No se pudo guardar';
      return SYNC === 'localonly' ? 'Guardado solo en este equipo' : 'Sincronizado';
    }

    // busca una tarea por id para la interfaz
    function findTaskUi(id) {
      return Core.taskById(STATE, id);
    }

    // clase y palabra del resultado de una sesión, derivadas de lo que se guardó
    function outcomeKind(s) {
      if (s.nextStep === null) return 'done';
      if (s.progress === 'yes') return 'done';
      if (s.progress === 'some') return 'progress';
      return 'stuck';
    }
    function outcomeWord(s) {
      if (s.nextStep === null) return 'Terminaste la tarea';
      if (s.progress === 'yes') return 'Avanzaste bien';
      if (s.progress === 'some') return 'Avanzaste algo';
      return 'Te trabaste';
    }

    // desfase del trazo del anillo: una vuelta completa por hora, solo señal de que el tiempo corre
    function ringOffset(ms) {
      var circumference = 289.03;
      var fraction = ((ms / 1000) % 3600) / 3600;
      return (circumference * (1 - fraction)).toFixed(2);
    }

    // ---------- guardado ----------
    // adopta un estado nuevo, repinta y guarda solo si cambió
    function apply(next) {
      if (next === STATE) { render(); return; }
      STATE = Core.stampSave(next, now());
      SAVE = 'saving';
      render();
      adapter.save(STATE).then(function () {
        SAVE = 'saved';
        refreshSaveIndicator();
      }, function () {
        SAVE = 'error';
        refreshSaveIndicator();
      });
    }

    // actualiza solo el indicador, sin repintar toda la vista
    function refreshSaveIndicator() {
      var el = document.getElementById('saveind');
      if (el) el.textContent = saveText();
    }

    // ---------- acciones de interfaz ----------
    // captura: Enter guarda una tarea con solo título
    function doCapture(title) {
      var r = Core.captureTask(STATE, { title: title }, now());
      if (r.ok) apply(r.state);
    }

    // elegir para hoy; si falta la siguiente acción, se abre el formulario y se reintenta
    function doChooseForToday(taskId) {
      var r = Core.chooseForToday(STATE, { taskId: taskId, date: localDate() }, now());
      if (r.ok) { apply(r.state); return; }
      VIEW = { name: 'definir', taskId: taskId, back: VIEW.name, choose: true };
      render();
    }

    // subir una tarea al primer lugar del plan de hoy
    function doMoveToFirst(taskId) {
      var r = Core.moveToFirst(STATE, { date: localDate(), taskId: taskId });
      if (r.ok) apply(r.state);
    }

    // empezar: abre una sesión y muestra la vista Sesión
    function doStart(taskId) {
      var r = Core.startSession(STATE, { taskId: taskId }, now());
      if (r.ok) { VIEW = { name: 'sesion' }; apply(r.state); }
    }

    // guardar la definición (usada por Definir, por Elegir sin acción y por Ajustar)
    function onSaveDefine() {
      var o = document.getElementById('d-outcome');
      var n = document.getElementById('d-next');
      var outcome = o ? o.value : '';
      var nextAction = n ? n.value : '';
      var r = Core.defineTask(STATE, { taskId: VIEW.taskId, outcome: outcome, nextAction: nextAction }, now());
      if (!r.ok) {
        VIEW.defineError = r.error;
        VIEW.draftOutcome = outcome;
        VIEW.draftNext = nextAction;
        render();
        return;
      }
      var s = r.state;
      if (VIEW.choose) {
        var r2 = Core.chooseForToday(s, { taskId: VIEW.taskId, date: localDate() }, now());
        if (r2.ok) s = r2.state;
      }
      VIEW = { name: VIEW.back || 'hoy' };
      apply(s);
    }

    // cerrar la sesión con las respuestas del cierre
    function doCloseSession(progress, finished, nextStep) {
      var r = Core.closeSession(STATE, { progress: progress, finished: finished, nextStep: nextStep }, now());
      if (!r.ok) return;
      stopElapsed();
      VIEW = { name: 'hoy' };
      apply(r.state);
    }

    // exportar el estado como archivo JSON
    function doExport() {
      var text = Core.exportState(STATE);
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'siguiente.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // importar un archivo JSON: valida y reemplaza; si es inválido no toca nada y avisa
    function doImport(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var r = Core.importState(STATE, String(reader.result));
        if (!r.ok) { VIEW = { name: 'hoy', menu: true, importError: r.error }; render(); return; }
        VIEW = { name: 'hoy' };
        apply(r.state);
      };
      reader.onerror = function () {
        VIEW = { name: 'hoy', menu: true, importError: 'No se pudo leer el archivo.' };
        render();
      };
      reader.readAsText(file);
    }

    // borrar todo, tras confirmación
    function doDeleteAll() {
      stopElapsed();
      VIEW = { name: 'hoy' };
      apply(Core.emptyState());
    }

    // ---------- iconos: un único trazo consistente para toda la navegación ----------
    function svgIcon(inner) {
      return '<svg viewBox="0 0 20 20" aria-hidden="true">' + inner + '</svg>';
    }
    var ICON = {
      hoy: svgIcon('<circle cx="10" cy="11" r="6"/><path d="M10 3v1.6"/>'),
      bandeja: svgIcon('<path d="M3 12l2.2-6.6A1.5 1.5 0 016.6 4.4h6.8a1.5 1.5 0 011.4 1L17 12"/><path d="M3 12v3.6A1.4 1.4 0 004.4 17h11.2a1.4 1.4 0 001.4-1.4V12"/><path d="M3 12h3.6l1 2h4.8l1-2H17"/>'),
      semana: svgIcon('<rect x="3" y="4.5" width="14" height="12.5" rx="1.6"/><path d="M3 8.5h14M7 3v3M13 3v3"/>'),
      progreso: svgIcon('<path d="M4.5 16v-3.5M10 16V7M15.5 16v-6"/>'),
      menu: '<svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="4.5" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/></svg>',
      close: '<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>'
    };

    // ---------- render ----------
    function render() {
      var app = document.getElementById('app');
      var keepFocus = document.activeElement && document.activeElement.id === 'capture';
      var full = (VIEW.name === 'sesion' || VIEW.name === 'cerrar') && !VIEW.menu;

      var body = VIEW.menu ? menuHtml() : viewHtml();
      var chrome = full ? '' : (appbarHtml() + captureSlot());
      app.innerHTML = chrome + '<div class="view' + (full ? ' view--full' : '') + '">' + body + '</div>' + tabbarHtml();
      wire();

      if (keepFocus) {
        var c = document.getElementById('capture');
        if (c) c.focus();
      }
      if (VIEW.name === 'sesion' && !VIEW.menu) startElapsed(); else stopElapsed();
    }

    // barra superior común
    function appbarHtml() {
      var titles = { hoy: 'Hoy', bandeja: 'Bandeja', definir: 'Definir', semana: 'Esta semana', progreso: 'Progreso' };
      var title = VIEW.menu ? 'Menú' : (titles[VIEW.name] || 'Siguiente');
      return '<div class="appbar">' +
        '<h1>' + esc(title) + '</h1>' +
        '<span class="saveind" id="saveind">' + esc(saveText()) + '</span>' +
        '<button type="button" class="iconbtn" data-action="toggle-menu" aria-label="' +
          (VIEW.menu ? 'Cerrar menú' : 'Menú') + '">' + (VIEW.menu ? ICON.close : ICON.menu) + '</button>' +
      '</div>';
    }

    // campo de captura: presente en Hoy y en Bandeja
    function captureSlot() {
      if (VIEW.menu || (VIEW.name !== 'hoy' && VIEW.name !== 'bandeja')) return '';
      return '<input id="capture" class="capture" type="text" autocomplete="off" ' +
        'placeholder="¿Qué quieres avanzar?" aria-label="¿Qué quieres avanzar?">';
    }

    // navegación inferior de cuatro secciones
    function tabbarHtml() {
      var items = [
        ['hoy', 'Hoy', ICON.hoy],
        ['bandeja', 'Bandeja', ICON.bandeja],
        ['semana', 'Semana', ICON.semana],
        ['progreso', 'Progreso', ICON.progreso]
      ];
      return '<nav class="tabbar" aria-label="Secciones">' + items.map(function (it) {
        var current = (!VIEW.menu && VIEW.name === it[0]) ? ' aria-current="page"' : '';
        return '<button type="button" class="tab" data-action="go" data-view="' + it[0] + '"' + current + '>' +
          it[2] + '<span>' + it[1] + '</span></button>';
      }).join('') + '</nav>';
    }

    // enruta a la vista actual
    function viewHtml() {
      switch (VIEW.name) {
        case 'bandeja': return bandejaHtml();
        case 'definir': return definirHtml();
        case 'sesion': return sessionScreen();
        case 'cerrar': return sessionScreen();
        case 'semana': return semanaHtml();
        case 'progreso': return progresoHtml();
        default: return hoyHtml();
      }
    }

    // aviso para volver a una sesión abierta desde otra vista
    function sessionBanner() {
      var s = Core.openSession(STATE);
      if (!s || VIEW.name === 'sesion' || VIEW.name === 'cerrar') return '';
      return '<button type="button" class="notice as-button" data-action="go" data-view="sesion">' +
        'Tienes una sesión abierta desde las ' + esc(fmtClock(s.startedAt)) + '. Volver a la sesión.</button>';
    }

    // Hoy: la primera acción del plan como elemento principal, y debajo el resto
    function hoyHtml() {
      var plan = Core.todayPlan(STATE, localDate()).filter(function (it) { return it.task; });
      if (plan.length === 0) {
        return sessionBanner() +
          '<div class="empty">' +
            '<p>No has elegido nada para hoy.</p>' +
            '<button type="button" class="btn btn--quiet" data-action="go" data-view="bandeja">Ver la bandeja</button>' +
          '</div>';
      }
      var first = plan[0];
      var rest = plan.slice(1);
      var html = sessionBanner();
      html += '<p class="kicker">Ahora</p>';
      html += '<p class="hero">' + esc(first.task.nextAction) + '</p>';
      if (first.task.outcome) {
        html += '<p class="for-outcome">Para: ' + esc(first.task.outcome) + '</p>';
      }
      html += '<div class="stack">' +
        '<button type="button" class="btn btn--primary" data-action="start" data-id="' + esc(first.task.id) + '">Empezar</button>' +
        '<button type="button" class="btn btn--quiet" data-action="adjust" data-id="' + esc(first.task.id) + '">Ajustar</button>' +
      '</div>';
      if (rest.length) {
        html += '<p class="section-label">Después</p><ul class="rows tight">';
        rest.forEach(function (it) {
          html += '<li class="later"><span class="txt">' + esc(it.task.nextAction) +
            (it.task.outcome ? '<span class="sub">Para: ' + esc(it.task.outcome) + '</span>' : '') +
            '</span><button type="button" class="link" data-action="tofirst" data-id="' + esc(it.task.id) + '">Subir</button></li>';
        });
        html += '</ul>';
      }
      return html;
    }

    // Bandeja: tareas en inbox o active, con dos acciones por tarea
    function bandejaHtml() {
      var tasks = Core.inbox(STATE);
      var today = Core.todayPlan(STATE, localDate());
      var inToday = {};
      today.forEach(function (it) { inToday[it.taskId] = true; });

      var html = sessionBanner();
      if (tasks.length === 0) {
        return html + '<div class="empty"><p>La bandeja está vacía.<br>Escribe arriba para capturar algo.</p></div>';
      }
      html += '<ul class="rows">';
      tasks.forEach(function (t) {
        html += '<li class="task">';
        html += '<div class="t-title">' + esc(t.title) + '</div>';
        html += t.nextAction
          ? '<div class="t-next">Siguiente: ' + esc(t.nextAction) + '</div>'
          : '<div class="t-next none">Sin siguiente acción</div>';
        html += '<div class="t-actions">';
        html += '<button type="button" class="btn btn--quiet btn--small" data-action="define" data-id="' + esc(t.id) + '">Definir</button>';
        html += inToday[t.id]
          ? '<span class="badge">En el plan de hoy</span>'
          : '<button type="button" class="btn btn--primary btn--small" data-action="choose" data-id="' + esc(t.id) + '">Elegir para hoy</button>';
        html += '</div></li>';
      });
      html += '</ul>';
      return html;
    }

    // formulario único de definición
    function definirHtml() {
      var task = findTaskUi(VIEW.taskId);
      if (!task) {
        return '<div class="empty"><p>No se encontró la tarea.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="bandeja">Volver a la bandeja</button></div>';
      }
      var outcomeVal = ('draftOutcome' in VIEW) ? VIEW.draftOutcome : (task.outcome || '');
      var nextVal = ('draftNext' in VIEW) ? VIEW.draftNext : (task.nextAction || '');

      var html = '<p class="define-for">' + esc(task.title) + '</p>';
      if (VIEW.defineError) html += '<p class="notice">' + esc(VIEW.defineError) + '</p>';
      html += '<label class="field"><span>Resultado deseado (opcional)</span>' +
        '<input id="d-outcome" type="text" autocomplete="off" value="' + esc(outcomeVal) + '"></label>';
      html += '<label class="field"><span>Siguiente acción</span>' +
        '<input id="d-next" type="text" autocomplete="off" value="' + esc(nextVal) + '"></label>';
      html += '<div class="stack">' +
        '<button type="button" class="btn btn--primary" data-action="save-define">Guardar</button>' +
        '<button type="button" class="link" data-action="cancel-define">Cancelar</button>' +
      '</div>';
      return html;
    }

    // pantalla de sesión: en curso o en cierre
    function sessionScreen() {
      var s = Core.openSession(STATE);
      if (!s) {
        return '<div class="empty"><p>No hay ninguna sesión abierta.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Ir a Hoy</button></div>';
      }
      return VIEW.name === 'cerrar' ? cerrarHtml(s) : sesionHtml(s);
    }

    // sesión en curso: acción, anillo con el tiempo transcurrido y un solo botón
    function sesionHtml(s) {
      var task = findTaskUi(s.taskId);
      var ms = Core.sessionDuration(s, now());
      var html = '<div class="session">';
      if (VIEW.reentry) {
        html += '<p class="notice">Sesión abierta desde el ' + esc(fmtStamp(s.startedAt)) + '.</p>';
      }
      html += '<p class="kicker">En curso</p>';
      html += '<p class="hero">' + esc(task ? task.nextAction : '(tarea no encontrada)') + '</p>';
      if (task && task.outcome) {
        html += '<p class="for-outcome">Para: ' + esc(task.outcome) + '</p>';
      }
      html += '<div class="ring-stage"><div class="ring-wrap">' +
        '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">' +
          '<circle class="ring-track" cx="50" cy="50" r="46"></circle>' +
          '<circle class="ring-sweep" cx="50" cy="50" r="46" style="stroke-dashoffset:' + ringOffset(ms) + '"></circle>' +
        '</svg>' +
        '<div class="ring-label"><strong id="elapsed">' + esc(fmtDur(ms)) + '</strong>' +
          '<span>desde las ' + esc(fmtClock(s.startedAt)) + '</span></div>' +
      '</div></div>';
      html += '<div class="stack"><button type="button" class="btn btn--primary" data-action="finish">Listo</button></div>';
      html += '</div>';
      return html;
    }

    // cierre de la sesión en tres preguntas encadenadas
    function cerrarHtml(s) {
      var task = findTaskUi(s.taskId);
      var step = VIEW.step || 1;

      var html = '<div class="session"><p class="kicker">Cerrar la sesión</p>';
      if (step === 1) {
        html += '<p class="q">¿Avanzaste?</p><div class="results">' +
          '<button type="button" class="result" data-action="cl-progress" data-value="yes">Sí, avancé bien</button>' +
          '<button type="button" class="result" data-action="cl-progress" data-value="some">Avancé algo</button>' +
          '<button type="button" class="result" data-action="cl-progress" data-value="no">Me trabé</button>' +
        '</div>';
      } else if (step === 2) {
        html += '<p class="q">¿Terminaste la tarea?</p><div class="results">' +
          '<button type="button" class="result" data-action="cl-finished" data-value="yes">Sí, la terminé</button>' +
          '<button type="button" class="result" data-action="cl-finished" data-value="no">Todavía no</button>' +
        '</div>';
      } else {
        var def = task ? (task.nextAction || '') : '';
        html += '<p class="q">¿Cuál es el siguiente paso cuando vuelvas?</p>' +
          '<label class="field"><span>Siguiente acción</span>' +
          '<input id="cl-next" type="text" autocomplete="off" value="' + esc(def) + '"></label>' +
          '<div class="stack"><button type="button" class="btn btn--primary" data-action="cl-confirm">Guardar y cerrar</button></div>';
      }
      html += '<div class="stack"><button type="button" class="link" data-action="cl-cancel">Cancelar</button></div>';
      html += '</div>';
      return html;
    }

    // Semana: lo que trabajaste, de lunes a hoy; un día vacío es solo un día vacío
    function semanaHtml() {
      var today = localDate();
      var days = weekUpToToday(today);
      var banner = sessionBanner();

      // datos de cada día: sesiones cerradas y, solo hoy, lo que queda en el plan
      var perDay = days.map(function (ds) {
        var range = localDayRange(ds);
        var sessions = Core.sessionsBetween(STATE, range.startIso, range.endIso);
        var planned = [];
        if (ds === today) {
          var already = {};
          sessions.forEach(function (x) { already[x.taskId] = true; });
          Core.todayPlan(STATE, today).forEach(function (it) {
            if (it.task && !already[it.taskId]) planned.push(it.task);
          });
        }
        return { ds: ds, sessions: sessions, planned: planned };
      });

      var hasData = perDay.some(function (d) { return d.sessions.length || d.planned.length; });
      if (!hasData) {
        return banner + '<div class="empty">' +
          '<p>Todavía no has trabajado ninguna sesión esta semana.<br>Cuando cierres una, aparecerá aquí por día.</p>' +
          '<button type="button" class="btn btn--quiet" data-action="go" data-view="hoy">Ir a Hoy</button></div>';
      }

      var html = banner;
      perDay.forEach(function (d) {
        html += '<div class="day' + (d.ds === today ? ' today' : '') + '">' +
          '<div class="day-head"><span class="d-name">' + esc(fmtDayName(d.ds)) + '</span>' +
          '<span class="d-date">' + esc(fmtDayDate(d.ds)) + '</span></div>';
        if (d.sessions.length || d.planned.length) {
          html += '<ul class="day-items">';
          d.sessions.forEach(function (x) {
            var t = Core.taskById(STATE, x.taskId);
            html += '<li class="d-item"><span class="dot dot--' + outcomeKind(x) + '"></span>' +
              '<span>' + esc(t ? t.title : '(tarea eliminada)') + '</span>' +
              '<span class="d-dur">' + esc(fmtDur(Core.sessionDuration(x, x.endedAt))) + '</span></li>';
          });
          d.planned.forEach(function (t) {
            html += '<li class="d-item planned"><span>' + esc(t.nextAction) + '</span>' +
              '<span class="tag">en el plan</span></li>';
          });
          html += '</ul>';
        } else {
          html += '<p class="day-empty">Sin sesiones</p>';
        }
        html += '</div>';
      });
      return html;
    }

    // Progreso: cifras neutras y el registro completo, que nunca se borra
    function progresoHtml() {
      var stats = Core.sessionStats(STATE);
      var log = Core.closedSessions(STATE);
      var html = sessionBanner();

      html += '<div class="panel"><div class="figures">' +
        '<div class="figure"><strong>' + stats.count + '</strong><span>sesiones</span></div>' +
        '<div class="figure"><strong>' + esc(fmtDurShort(stats.totalMs)) + '</strong><span>tiempo</span></div>' +
        '<div class="figure"><strong>' + stats.completedTasks + '</strong><span>tareas hechas</span></div>' +
      '</div></div>';

      if (log.length === 0) {
        html += '<div class="empty"><p>Cuando cierres tu primera sesión aparecerá aquí.<br>El registro no se borra nunca.</p></div>';
        return html;
      }

      html += '<p class="section-label">Registro</p><ul class="log">';
      log.forEach(function (x) {
        var t = Core.taskById(STATE, x.taskId);
        html += '<li><div class="log-head">' +
          '<span>' + esc(fmtStamp(x.startedAt)) + '</span>' +
          '<span class="l-task">' + esc(t ? t.title : '(tarea eliminada)') + '</span>' +
          '<span class="l-dur">' + esc(fmtDur(Core.sessionDuration(x, x.endedAt))) + '</span>' +
        '</div>' +
        '<div class="log-outcome"><span class="dot dot--' + outcomeKind(x) + '"></span><span>' + esc(outcomeWord(x)) + '</span></div>' +
        (x.nextStep ? '<span class="log-step">Siguiente: ' + esc(x.nextStep) + '</span>' : '') +
        '</li>';
      });
      html += '</ul>';
      return html;
    }

    // menú: exportar, importar, borrar todo y una nota de sincronización
    function menuHtml() {
      var html = '';
      if (VIEW.importError) {
        html += '<p class="notice">No se pudo importar: ' + esc(VIEW.importError) + '</p>';
      }
      html += '<div class="stack">';
      html += '<button type="button" class="btn btn--quiet" data-action="export">Exportar</button>';
      html += '<label class="btn btn--quiet filelabel">Importar' +
        '<input id="importfile" type="file" accept="application/json,.json"></label>';
      if (!VIEW.confirmWipe) {
        html += '<button type="button" class="btn btn--quiet" data-action="wipe-ask">Borrar todo</button>';
      } else {
        html += '<p class="notice">Esto borra todas las tareas y sesiones. No se puede deshacer.</p>';
        html += '<button type="button" class="btn btn--primary" data-action="wipe-yes">Sí, borrar todo</button>';
        html += '<button type="button" class="link" data-action="wipe-no">Cancelar</button>';
      }
      html += '</div>';
      if (SYNC !== 'off') {
        var hasToken = !!syncToken();
        html += '<p class="section-label">Sincronización</p>';
        html += '<p class="notice">' + (SYNC === 'localonly'
          ? 'Ahora mismo se guarda solo en este equipo. Se volverá a sincronizar cuando haya conexión.'
          : 'Los cambios se sincronizan con tu espacio en la nube.') + '</p>';
        html += '<div class="stack">' +
          '<label class="field"><span>' +
            (hasToken ? 'Cambiar el token de acceso' : 'Token de acceso (déjalo vacío si la URL no lo pide)') +
          '</span><input id="synctoken" type="password" autocomplete="off" placeholder="' +
            (hasToken ? 'hay un token guardado' : 'pega aquí el token') + '"></label>' +
          '<button type="button" class="btn btn--quiet" data-action="save-token">Guardar token</button>' +
          (hasToken ? '<button type="button" class="link" data-action="clear-token">Quitar el token de este equipo</button>' : '') +
        '</div>';
      }
      return html;
    }

    // ---------- eventos ----------
    function wire() {
      var cap = document.getElementById('capture');
      if (cap) {
        cap.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var value = cap.value;
          cap.value = '';
          doCapture(value);
        });
      }
      var imp = document.getElementById('importfile');
      if (imp) {
        imp.addEventListener('change', function () {
          if (imp.files && imp.files[0]) doImport(imp.files[0]);
        });
      }
    }

    // clic delegado sobre el contenedor
    function onClick(e) {
      var btn = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      var id = btn.getAttribute('data-id');
      var view = btn.getAttribute('data-view');
      var value = btn.getAttribute('data-value');

      if (action === 'go') {
        VIEW = { name: view };
        render();
      } else if (action === 'toggle-menu') {
        VIEW.menu = !VIEW.menu;
        VIEW.confirmWipe = false;
        VIEW.importError = null;
        render();
      } else if (action === 'define') {
        VIEW = { name: 'definir', taskId: id, back: 'bandeja', choose: false };
        render();
      } else if (action === 'choose') {
        doChooseForToday(id);
      } else if (action === 'adjust') {
        VIEW = { name: 'definir', taskId: id, back: 'hoy', choose: false };
        render();
      } else if (action === 'start') {
        doStart(id);
      } else if (action === 'tofirst') {
        doMoveToFirst(id);
      } else if (action === 'save-define') {
        onSaveDefine();
      } else if (action === 'cancel-define') {
        VIEW = { name: VIEW.back || 'hoy' };
        render();
      } else if (action === 'finish') {
        VIEW = { name: 'cerrar', step: 1, progress: null, finished: null };
        render();
      } else if (action === 'cl-progress') {
        VIEW.progress = value;
        VIEW.step = 2;
        render();
      } else if (action === 'cl-finished') {
        if (value === 'yes') {
          doCloseSession(VIEW.progress, true, null);
        } else {
          VIEW.finished = false;
          VIEW.step = 3;
          render();
        }
      } else if (action === 'cl-confirm') {
        var nx = document.getElementById('cl-next');
        doCloseSession(VIEW.progress, false, nx ? nx.value : '');
      } else if (action === 'cl-cancel') {
        VIEW = { name: 'sesion' };
        render();
      } else if (action === 'export') {
        doExport();
      } else if (action === 'wipe-ask') {
        VIEW.confirmWipe = true;
        render();
      } else if (action === 'wipe-yes') {
        doDeleteAll();
      } else if (action === 'wipe-no') {
        VIEW.confirmWipe = false;
        render();
      } else if (action === 'save-token') {
        var tk = document.getElementById('synctoken');
        if (tk && tk.value.trim()) {
          setSyncToken(tk.value);
          VIEW = { name: 'hoy' };
          // recarga con el nuevo token para traer lo que ya haya en la nube
          adapter.load().then(function (loaded) {
            STATE = usableState(loaded);
            SAVE = 'saved';
            render();
          }, function () { render(); });
        } else {
          render();
        }
      } else if (action === 'clear-token') {
        setSyncToken('');
        render();
      }
    }

    // ---------- tiempo transcurrido: el intervalo solo repinta, nunca cuenta ni guarda ----------
    function startElapsed() {
      stopElapsed();
      tickElapsed();
      elapsedTimer = setInterval(tickElapsed, 1000);
    }
    function tickElapsed() {
      var s = Core.openSession(STATE);
      var el = document.getElementById('elapsed');
      if (!s || !el) { stopElapsed(); return; }
      var ms = Core.sessionDuration(s, now());
      el.textContent = fmtDur(ms);
      if (!REDUCE) {
        var sweep = document.querySelector('.ring-sweep');
        if (sweep) sweep.style.strokeDashoffset = ringOffset(ms);
      }
    }
    function stopElapsed() {
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    }

    // ---------- arranque ----------
    // normaliza lo cargado a un estado usable
    function usableState(loaded) {
      return (loaded && typeof loaded === 'object' && !Array.isArray(loaded))
        ? Core.migrate(loaded)
        : Core.emptyState();
    }

    function init() {
      document.getElementById('app').addEventListener('click', onClick);
      adapter.load().then(function (loaded) {
        STATE = usableState(loaded);
        SAVE = 'saved';
        VIEW = Core.openSession(STATE) ? { name: 'sesion', reentry: true } : { name: 'hoy' };
        render();
      }, function () {
        STATE = Core.emptyState();
        SAVE = 'saved';
        VIEW = { name: 'hoy' };
        render();
      });
    }

    init();
  })();
  </script>
</body>
</html>
