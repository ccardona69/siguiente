/* Siguiente · interfaz editorial. Sin fuentes, imágenes ni librerías externas. */
:root {
  color-scheme: light;
  --bg: #f5f3ee;
  --sidebar: #fbfaf7;
  --surface: #fffefb;
  --surface-2: #eeebe4;
  --text: #2c2c2b;
  --text-dim: #656158;
  --text-faint: #6c675f;
  --line: #dfdbd2;
  --line-strong: #918b80;
  --accent: #a94724;
  --accent-fill: #b6532b;
  --accent-hover: #9e4522;
  --accent-ink: #fff;
  --accent-soft: #f6e9df;
  --green: #34734e;
  --green-soft: #e9f1e9;
  --red: #b43f35;
  --red-soft: #fae9e5;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --display: Georgia, "Times New Roman", serif;
  --r-control: 8px;
  --r-panel: 12px;
  --shadow: 0 1px 2px rgb(32 25 15 / 3%), 0 4px 16px rgb(32 25 15 / 3%);
  --sidebar-width: 212px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171513;
    --sidebar: #1b1916;
    --surface: #22201c;
    --surface-2: #2d2924;
    --text: #f4f0e8;
    --text-dim: #b8b0a4;
    --text-faint: #aaa296;
    --line: #403b34;
    --line-strong: #807567;
    --accent: #f29e6e;
    --accent-fill: #e68b57;
    --accent-hover: #f09c6a;
    --accent-ink: #211810;
    --accent-soft: #34271f;
    --green: #a2c2a5;
    --green-soft: #253128;
    --red: #f59c8c;
    --red-soft: #3b2520;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171513;
  --sidebar: #1b1916;
  --surface: #22201c;
  --surface-2: #2d2924;
  --text: #f4f0e8;
  --text-dim: #b8b0a4;
  --text-faint: #aaa296;
  --line: #403b34;
  --line-strong: #807567;
  --accent: #f29e6e;
  --accent-fill: #e68b57;
  --accent-hover: #f09c6a;
  --accent-ink: #211810;
  --accent-soft: #34271f;
  --green: #a2c2a5;
  --green-soft: #253128;
  --red: #f59c8c;
  --red-soft: #3b2520;
  --shadow: none;
}
* {
  box-sizing: border-box;
}
html {
  background: var(--bg);
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
select {
  cursor: pointer;
}
button {
  color: inherit;
}
button:disabled {
  cursor: not-allowed;
}
button,
a,
input,
select,
textarea,
[tabindex] {
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-offset: 2px;
}
[hidden] {
  display: none !important;
}
::selection {
  color: var(--text);
  background: var(--accent-soft);
}
svg {
  display: block;
  width: 20px;
  height: 20px;
  flex: none;
}
/* Titulares con líneas equilibradas y párrafos sin una palabra sola al final. */
h1,
h2,
.menu-intro {
  text-wrap: balance;
}
p {
  text-wrap: pretty;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  opacity: 0;
  pointer-events: none;
  position: fixed;
  z-index: 100;
  left: 16px;
  top: -100px;
  padding: 12px 16px;
  border-radius: 8px;
  color: var(--accent-ink);
  background: var(--accent-fill);
}
#main-content:focus-visible {
  outline-offset: -4px;
}
.skip-link:focus {
  opacity: 1;
  pointer-events: auto;
  top: 16px;
}
#app {
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
.sidebar {
  position: sticky;
  top: 0;
  overflow-y: auto;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 36px 16px 24px;
  border-right: 1px solid var(--line);
  background: var(--sidebar);
  display: none;
}
.brand {
  display: flex;
  gap: 9px;
  align-items: center;
  width: max-content;
  color: var(--text);
  font-size: 24px;
  line-height: 1;
  font-weight: 650;
  letter-spacing: -0.055em;
}
.brand-period {
  color: var(--accent);
  margin-left: -8px;
}
.brand-icon {
  width: 28px;
  height: 28px;
  color: var(--accent);
  margin-right: 2px;
}
.brand-caption {
  margin: 14px 0 32px;
  padding-left: 3px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.5;
}
.sidenav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text-dim);
  text-align: left;
  font-size: 15px;
  font-weight: 500;
}
.nav-item:hover {
  color: var(--text);
  background: var(--surface-2);
}
.nav-item[aria-current] {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 650;
}
.nav-count {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.nav-item[aria-current] .nav-count {
  color: var(--accent);
}
.sidebar-bottom {
  margin-top: auto;
  padding-top: 32px;
}
.sidebar-note {
  margin: 0 4px 24px;
  border-top: 1px solid var(--line);
  padding-top: 24px;
}
.sidebar-note strong {
  display: block;
  font-weight: 500;
  font-family: var(--display);
  font-size: 20px;
  line-height: 1.3;
  letter-spacing: -0.025em;
}
.sidebar-note p {
  margin: 12px 0 0;
  color: var(--text-dim);
  font-size: 14px;
}
.sidebar-actions {
  display: flex;
  gap: 4px;
}
.sidebar-actions .nav-item {
  flex: 1;
}
.sidebar-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 4px 0;
  color: var(--text-dim);
  font-size: 14px;
}
.sidebar-footer svg {
  width: 16px;
  height: 16px;
}
.workspace {
  min-width: 0;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  padding: max(20px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right)) 24px
    max(16px, env(safe-area-inset-left));
  scroll-padding-top: 16px;
  scroll-padding-bottom: 24px;
}
.content {
  max-width: 1072px;
  margin: 0 auto;
}
.appbar {
  margin-bottom: 20px;
}
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.eyebrow {
  margin: 0;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 550;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  display: none;
}
.topline-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-label {
  color: var(--text-dim);
  font-size: 14px;
  display: none;
}
.iconbtn {
  display: grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--surface);
  color: var(--text-dim);
}
.iconbtn:hover {
  border-color: var(--line-strong);
  color: var(--text);
}
.appbar h1 {
  margin: 0;
  font: 400 clamp(28px, 8vw, 32px)/1.14 var(--display);
  letter-spacing: -0.045em;
  overflow-wrap: anywhere;
}
.appbar-subtitle {
  margin: 8px 0 0;
  max-width: 65ch;
  color: var(--text-dim);
}
.mobile-brand {
  display: flex;
  font-size: 21px;
}
.mobile-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.saveind {
  color: var(--text-dim);
  font-size: 14px;
}
.appbar-save {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}
.appbar-save svg {
  width: 16px;
  height: 16px;
}
.capture-form {
  display: flex;
  align-items: center;
  margin: 0 0 20px;
  padding: 6px 6px 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-control);
  background: var(--surface);
  gap: 8px;
}
.capture-form:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.capture-form > svg {
  color: var(--text-dim);
  width: 18px;
  height: 18px;
}
.capture {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 8px 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}
.capture:focus-visible {
  outline: 0;
}
.capture::placeholder,
.field input::placeholder,
.log-search::placeholder {
  color: var(--text-faint);
  opacity: 1;
}
.capture-add {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: none;
  height: 44px;
  gap: 8px;
  border: 0;
  border-radius: 6px;
  background: var(--accent-fill);
  color: var(--accent-ink);
  font-size: 14px;
  font-weight: 600;
  min-width: 44px;
  width: 44px;
  padding: 0;
}
.capture-add:disabled {
  background: var(--surface-2);
  color: var(--text-dim);
}
.capture-add:not(:disabled):hover {
  background: var(--accent-hover);
}
kbd {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  min-height: 24px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text-dim);
  background: var(--surface);
  font: 400 14px/1 var(--font);
}
.capture-hint {
  color: var(--text-dim);
  font-size: 14px;
  display: none;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.btn-arrow {
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
}
.btn--primary {
  background: var(--accent-fill);
  color: var(--accent-ink);
}
.btn--primary:hover {
  background: var(--accent-hover);
}
.btn--quiet {
  background: var(--surface);
  border-color: var(--line-strong);
  color: var(--text);
}
.btn--quiet:hover {
  background: var(--surface-2);
}
.btn--light {
  background: var(--text);
  color: var(--bg);
}
.btn--light:hover {
  opacity: 0.9;
}
.btn--text {
  width: auto;
  min-height: 44px;
  padding: 8px 0;
  color: var(--text-dim);
  background: transparent;
  font-weight: 500;
}
.btn--text:hover {
  color: var(--text);
}
.btn--small {
  width: auto;
  min-height: 44px;
  padding: 8px 14px;
  font-size: 14px;
}
.btn--danger {
  color: var(--red);
  border-color: var(--red);
  background: var(--surface);
}
.btn--danger:hover {
  background: var(--red-soft);
}
.link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  gap: 8px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.link:hover {
  color: var(--accent);
}
.badge,
.t-tag {
  display: inline-flex;
  align-items: center;
  flex: none;
  gap: 6px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.5;
}
.badge--green {
  color: var(--green);
  border-color: transparent;
  background: var(--green-soft);
}
.badge--accent {
  color: var(--accent);
  border-color: transparent;
  background: var(--accent-soft);
}
.panel-kicker,
.empty-index,
.session-kicker {
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  line-height: 1.4;
}
.panel-kicker {
  margin: 0;
}
.today-layout {
  display: grid;
  align-items: start;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.today-main {
  min-width: 0;
}
.focus-card,
.empty-state {
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 20px;
}
.focus-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.focus-number {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 14px;
}
.focus-number svg {
  width: 16px;
  height: 16px;
}
.task-context {
  margin: 0 0 12px;
  color: var(--text-dim);
  font-size: 16px;
  overflow-wrap: anywhere;
}
.hero {
  margin: 0;
  color: var(--text);
  font: 400 clamp(28px, 8vw, 32px)/1.2 var(--display);
  letter-spacing: -0.035em;
  overflow-wrap: anywhere;
}
.hero--long {
  font-size: 26px !important;
  line-height: 1.35;
  letter-spacing: -0.02em;
}
.hero--xlong {
  font-size: 22px !important;
  line-height: 1.4;
  letter-spacing: -0.01em;
}
.for-outcome {
  margin: 16px 0 0;
  color: var(--text-dim);
  font-size: 16px;
  overflow-wrap: anywhere;
}
.for-outcome strong {
  font-weight: 500;
}
.now-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  margin-top: 24px;
}
.now-actions .btn--primary {
  width: 100%;
  min-width: 0;
}
.focus-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 0;
  border-top: 1px solid var(--line);
  color: var(--text-dim);
  font-size: 14px;
  padding-top: 16px;
}
.focus-foot svg {
  width: 16px;
  height: 16px;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 0;
  justify-content: flex-start;
}
.empty-state .empty-mark {
  display: grid;
  place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  width: 40px;
  height: 40px;
  margin-bottom: 16px;
}
.empty-state h2 {
  margin: 10px 0 0;
  font: 400 30px/1.2 var(--display);
  letter-spacing: -0.035em;
}
.empty-state p {
  max-width: 43ch;
  color: var(--text-dim);
  margin: 12px 0 20px;
}
.empty-state .btn {
  width: 100%;
}
.empty-links {
  display: flex;
  flex-wrap: wrap;
  width: 100%;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}
.rail-card {
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  background: var(--surface);
  padding: 20px;
}
.rail-card + .rail-card {
  margin-top: 0;
}
.rail-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 600;
}
.rail-title svg {
  color: var(--text-dim);
  width: 18px;
  height: 18px;
}
.daily-metrics {
  display: grid;
  gap: 12px;
}
.daily-metric {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.daily-metric span {
  color: var(--text-dim);
  font-size: 14px;
}
.daily-metric strong {
  color: var(--text);
  font-size: 20px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}
.rail-caption {
  margin: 20px 0 0;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--text-dim);
  font-size: 14px;
}
.guide-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 16px;
  counter-reset: steps;
}
.guide-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.guide-list li::before {
  counter-increment: steps;
  content: counter(steps, decimal-leading-zero);
  color: var(--accent);
  font-size: 14px;
  padding-top: 2px;
}
.guide-list strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
}
.guide-list p {
  margin: 4px 0 0;
  color: var(--text-dim);
  font-size: 14px;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 24px 0 12px;
}
.section-heading h2,
.section-label {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}
.section-heading span {
  color: var(--text-dim);
  font-size: 14px;
}
.rows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.later {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
  gap: 12px;
  padding: 16px 0;
}
.later-index {
  color: var(--text-dim);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.later .txt {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  font-weight: 500;
  overflow-wrap: anywhere;

.sub {

.section-intro {

.inbox-controls {

.filter-select {

.results-count {

.t-topline {

.t-next {

}
.t-dur {

}
.t-actions {

}
.task .field {

}
.task .capture {

.action-hint {

.plain-empty,
.empty {

}

}
.plain-empty p {

.notice {

}
.notice--error {

}
.notice--accent {

  color: var(--accent);
}
.as-button {

  text-align: left;
  cursor: pointer;
}
.as-button:hover {

}
.as-button > svg {

}
.notice .link {

}
.demo-banner {
  display: flex;
  justify-content: space-between;
  margin: 0 0 20px;
  border-radius: 8px;
  color: var(--accent);
  background: var(--accent-soft);
  font-size: 14px;
  align-items: center;
  padding: 8px 12px;
  gap: 12px;
}
.demo-banner .link {

  white-space: nowrap;
}
.define-card,
.menu-card {

}
.define-for,
.ajustar-title {

}
.ajustar-note {

}
.ajustar-note strong {

}
.field {

  margin: 20px 0 0;
  color: var(--text);
  font-size: 16px;
}
.field > span {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
}
.field input,
.field textarea {

  min-width: 0;

  padding: 12px 14px;

  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
}
.field textarea {

}
.field input[aria-invalid="true"],
.task .capture[aria-invalid="true"] {

.field small {
  font-size: 14px;
  color: var(--text-dim);

}
.stack {

  gap: 12px;

}
.stack .btn {

}
.stack .link {

}
.stack--form {

}
.stack--form .btn {

}
.week-range {

.week-stack {

  background: var(--surface);
}
.day {

.day-head {

}
.d-name {

.d-date {

  font-size: 14px;
  font-weight: 400;
}
.d-today {
  display: inline-block;
  margin-top: 8px;
  color: var(--accent);
  font-size: 14px;
  margin-left: auto;
}
.d-total {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 550;
}
.day-items {

  display: grid;
  gap: 12px;
}
.d-item {

  font-size: 16px;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.d-time,
.d-dur {

  font-size: 14px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.d-task {

  overflow-wrap: anywhere;
  flex: 1 1 calc(100% - 56px);
}
.day-empty {

  color: var(--text-dim);
}
.day-plan {
  padding-top: 16px;
  margin-top: 16px;
  border-top: 1px solid var(--line);
}
.day-plan:first-child {
  margin-top: 0;
  padding-top: 0;
  border: 0;
}
.day-plan-label {
  color: var(--accent);
  font-size: 14px;
  margin: 0 0 12px;
}
.week-note {
  margin: 20px 0 0;
  color: var(--text-dim);
  font-size: 14px;
}
.panel {
  margin-bottom: 28px;
}
.panel-note {
  margin: 0 0 16px;
  color: var(--text-dim);
  font-size: 14px;
}
.figures {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.figure {
  border: 1px solid var(--line);
  border-radius: var(--r-panel);

  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.figure strong {
  display: block;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  font-size: 28px;
  flex: none;
}
.figure span {
  display: block;
  color: var(--text-dim);
  font-size: 14px;
  margin: 0;
  text-align: right;
}
.log-controls {

  flex-wrap: wrap;
  justify-content: space-between;
  margin: 16px 0;
  align-items: stretch;
  gap: 12px;
}
.log-month {

  align-items: center;
  gap: 12px;

  flex: 1 1 100%;
  justify-content: space-between;

  width: 44px;

.log-month-btn:hover {

.log-month-btn[aria-disabled="true"] {

.log-month-btn[aria-disabled="true"]:hover {

}
.log-controls .search-field {
  flex: 1 1 180px;
  min-width: 180px;
}
.log {

  margin: 0;
  list-style: none;
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  background: var(--surface);
}
.log:empty {
  border: 0;
}
.log > li {
  border-bottom: 1px solid var(--line);
  padding: 20px;
}
.log > li:last-child {

}
.log-line {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: baseline;
}
.l-task {
  font-weight: 550;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 16px;
}
.l-dur {
  flex: none;
  color: var(--text-dim);
  font-size: 14px;
  white-space: nowrap;
}
.log-date {
  color: var(--text-dim);
  margin: 8px 0;
  font-size: 14px;
}
.log-outcome {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text-dim);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  flex: none;
}
.dot--done {
  background: var(--green);
}
.dot--progress {
  background: var(--accent);
}
.dot--stuck {
  background: var(--text-dim);
}
.log-step {

  margin: 8px 0 0;
  font-size: 14px;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}
.log-empty {
  padding: 32px 16px;
  color: var(--text-dim);
  text-align: center;
  font-size: 16px;
}
.more-button {

  margin: 20px auto 0;
  width: auto;
}
.session-top {

  align-items: flex-start;
  margin-bottom: 16px;
}

  text-decoration: none;
}
.session {

}
.session-heading {
  text-align: center;
}
.session-kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.session-task-name {
  color: var(--text-dim);
  font-size: 16px;
  margin: 24px 0 12px;
  overflow-wrap: anywhere;
}

  font-size: clamp(27px, 7.7vw, 30px);
}
.tempo-stage {
  text-align: center;

  border-bottom: 1px solid var(--line);
  margin: 24px 0;
  padding: 20px 0;
}
.tempo-label {
  color: var(--text-dim);
  font-size: 14px;
  margin: 0 0 12px;
}
.tempo-time {
  display: block;
  font-weight: 450;
  line-height: 1.1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  font-size: clamp(44px, 16vw, 62px);
}
.tempo {
  position: relative;
  width: 148px;
  height: 2px;
  margin: 24px auto 20px;
  background: var(--line);
}
.tempo-fill {
  position: absolute;
  top: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}
.is-paused .tempo-fill {
  background: var(--text-dim);
}
.tempo-note {
  color: var(--text-dim);
  font-size: 14px;
  margin: 0;
}
.session-end {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.session-hint {
  color: var(--text-dim);
  font-size: 14px;
  text-align: center;
  margin: 20px 0 0;
}
.close-screen h1 {
  margin: 12px 0;
  font: 400 32px/1.2 var(--display);
  letter-spacing: -0.03em;
}
.close-screen > p {
  color: var(--text-dim);
  margin: 0 0 24px;
}
.progress-options {
  border: 0;
  padding: 0;
  margin: 0;
}
.progress-options legend {
  font-weight: 500;
  margin-bottom: 12px;
}
.choice-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}
.choice {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;

  justify-content: flex-start;
  min-height: 48px;
  font-size: 16px;
}
.choice:has(input:checked) {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
input[type="radio"],
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--accent-fill);
  flex: none;
}
.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  cursor: pointer;
  margin-top: 20px;
  font-size: 16px;
}
.close-options {
  display: grid;
  gap: 12px;
}
.close-options > button {
  display: flex;
  justify-content: space-between;
  min-height: 48px;
  padding: 12px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
}
.menu-intro {
  margin: 0;
  font: 400 28px/1.3 var(--display);
  letter-spacing: -0.025em;
}
.menu-section {
  padding-top: 24px;
  margin-top: 24px;
  border-top: 1px solid var(--line);
}

  display: none;
}
.menu-section h2 {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 600;
}
.menu-section p,
.sample-section p,
.menu-footer {

  font-size: 14px;
  margin: 12px 0 16px;
}
.theme-options {

  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.theme-options button {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--text-dim);
  background: var(--surface);
  font-size: 14px;
  flex-direction: column;
  gap: 6px;
  min-height: 72px;
}
.theme-options button[aria-pressed="true"] {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent);
}
.filelabel {
  position: relative;
  cursor: pointer;
}
.filelabel input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.filelabel:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
.sample-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.menu-footer {
  margin: 24px 0 0;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.shortcut-list {
  display: flex;
  gap: 8px 24px;
  flex-wrap: wrap;
  padding: 0;
  list-style: none;
  margin: 16px 0 0;
}
.shortcut-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 14px;
}
.tabbar {
  position: relative;
  z-index: 40;
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  padding-block: 8px max(8px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--sidebar);
  padding-inline: max(8px, env(safe-area-inset-left))
    max(8px, env(safe-area-inset-right));

.toast {
  display: inline;
  color: var(--accent);
  font-size: 14px;
  line-height: 1.5;
  pointer-events: none;
}
.appbar-save {
  max-width: 100%;
}
.appbar-save #status-message-slot {
  min-width: 0;

.appbar-save:has(.toast:not(:empty)) #save-icon,
.appbar-save:has(.toast:not(:empty)) #saveind {
  display: none;
}
.session-feedback:has(.toast:not(:empty)) {
  padding: 12px 16px;
  margin: 0 0 16px;
  border-radius: 8px;
  background: var(--accent-soft);
}
.toast:empty {
  display: none;
}
.noscript {
  margin: 48px auto;
  padding: 24px;
  max-width: 680px;
}
.today-rail {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
.mobile-brand .brand-icon {
  width: 24px;
  height: 24px;
}
.tab {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  min-height: 56px;
  padding: 4px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
}
.tab[aria-current] {
  color: var(--accent);
  background: var(--accent-soft);
}
.tab svg {
  width: 20px;
  height: 20px;
}
.capture-add span {
  display: none;
}
.t-tag {
  font-size: 14px;
}
.t-actions .btn {
  flex: 1 1 auto;
}
.t-actions .badge {
  flex: 1 1 auto;
  justify-content: center;
  min-height: 44px;
}
.demo-banner > span {
  max-width: 26ch;
}
.d-name,
.d-date,
.d-today {
  display: inline;
  margin: 0;
}
.d-dur {
  padding-left: 47px;
}
.session-top .saveind {
  padding-top: 12px;

}
.stack--form .link {

.empty-links .link {

@media (min-width: 640px) {
  .workspace {
    padding: max(24px, env(safe-area-inset-top)) 24px 32px;
  }
  .appbar h1 {
    font-size: 36px;
  }
  .appbar-subtitle {
    margin-top: 12px;

<div id="app"></div>
<div id="announcement" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><style>#app{display:none}</style><div class="noscript"><h1>Siguiente necesita JavaScript.</h1><p>Actívalo en tu navegador para capturar tareas y registrar sesiones. No se envían datos a servidores en la versión local.</p></div></noscript>
<script>
/* Siguiente Core — modelo puro, sin DOM, red ni persistencia. */
(function (root) {
  'use strict';
  const VERSION = 2;
  const copy = (value) => JSON.parse(JSON.stringify(value));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const ok = (state) => ({ ok: true, state });
  const fail = (error) => ({ ok: false, error });
  const stamp = (iso) =>
    typeof iso === 'string' &&
    /^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,3})?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$/.test(
      iso,
    ) &&
    day(iso.slice(0, 10)) &&
    Number.isFinite(Date.parse(iso));
  const text = (value) => (typeof value === 'string' ? value.trim() : '');
  const record = (value) => !!value && typeof value === 'object' && !Array.isArray(value);
  function safeTree(value, depth) {
    if (depth > 24) return false;
    if (!value || typeof value !== 'object') return true;
    return Object.keys(value).every(
      (key) =>
        !['__proto__', 'constructor', 'prototype'].includes(key) && safeTree(value[key], depth + 1),
    );
  }
  const statuses = ['inbox', 'active', 'paused', 'done'];
  const progress = ['yes', 'some', 'no'];
  const uid = (prefix) =>
    prefix +
    '_' +
    (root.crypto && root.crypto.randomUUID
      ? root.crypto.randomUUID()
      : Math.random().toString(36).slice(2) + '_' + Math.random().toString(36).slice(2));
  function day(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const d = new Date(value + 'T12:00:00Z');
    return Number.isFinite(+d) && d.toISOString().slice(0, 10) === value;
  }
  function emptyState() {
    return { schemaVersion: VERSION, savedAt: null, tasks: [], plans: [], sessions: [] };
  }
  function taskById(s, id) {
    return s.tasks.find((t) => t.id === id) || null;
  }
  function openSession(s) {
    return s.sessions.find((x) => !x.endedAt) || null;
  }
  function closedSessions(s) {
    return newestFirst(s.sessions.filter((x) => x.endedAt));
  }
  // ordena de la sesión más reciente a la más antigua leyendo cada marca una sola vez
  function newestFirst(xs) {
    return xs
      .map((x) => [Date.parse(x.startedAt), x])
      .sort((a, b) => b[0] - a[0])
      .map((pair) => pair[1]);
  }
  function inbox(s) {
    return s.tasks
      .filter((t) => t.status === 'inbox' || t.status === 'active')
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
  }
  function todayPlan(s, date) {
    const p = s.plans.find((p) => p.date === date);
    return (p ? p.taskIds : [])
      .map((taskId) => ({ taskId, task: taskById(s, taskId) }))
      .filter(
        (it) => it.task && it.task.nextAction && ['inbox', 'active'].includes(it.task.status),
      );
  }
  function planFor(s, date, iso) {
    let p = s.plans.find((p) => p.date === date);
    if (!p) {
      p = { date, taskIds: [], updatedAt: iso };
      s.plans.push(p);
    }
    p.updatedAt = iso;
    return p;
  }
  function validTask(s, id, iso) {
    if (!stamp(iso)) return fail('La fecha de la operación no es válida.');
    const task = taskById(s, id);
    if (!task) return fail('No se encontró la tarea.');
    return Date.parse(iso) < Date.parse(task.updatedAt)
      ? fail('El reloj del equipo cambió. Revisa la fecha antes de continuar.')
      : null;
  }
  function captureTask(s, p, iso) {
    const title = text(p.title);
    if (!stamp(iso)) return fail('La fecha de captura no es válida.');
    if (!title) return fail('Escribe el nombre de la tarea.');
    if (title.length > 240) return fail('El nombre puede tener como máximo 240 caracteres.');
    if (s.tasks.length >= 10000)
      return fail('Llegaste al límite de tareas. Exporta una copia antes de continuar.');
    const n = copy(s);
    n.tasks.push({
      id: uid('task'),
      title,
      nextAction: null,
      outcome: null,
      status: 'inbox',
      createdAt: iso,
      updatedAt: iso,
      completedAt: null,
    });
    return ok(n);
  }
  function defineTask(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const action = text(p.nextAction),
      title = p.title === undefined ? taskById(s, p.taskId).title : text(p.title);
    const outcome = p.outcome == null ? null : text(p.outcome) || null;
    if (!title || title.length > 240) return fail('Escribe un nombre de entre 1 y 240 caracteres.');
    if (!action) return fail('Define una acción pequeña y concreta para poder empezar.');
    if (action.length > 500 || (outcome && outcome.length > 500))
      return fail('Cada campo puede tener como máximo 500 caracteres.');
    if (taskById(s, p.taskId).status === 'done') return fail('Esta tarea ya está terminada.');
    const n = copy(s),
      t = taskById(n, p.taskId);
    Object.assign(t, { title, nextAction: action, outcome, updatedAt: iso });
    if (t.status !== 'paused') t.status = 'active';
    return ok(n);
  }
  function chooseForToday(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const t = taskById(s, p.taskId);
    if (!day(p.date)) return fail('El día elegido no es válido.');
    if (t.status === 'done') return fail('Esta tarea ya está terminada.');
    if (t.status === 'paused') return fail('Recupera esta tarea de la pausa antes de elegirla.');
    if (!t.nextAction) return fail('Escribe primero la siguiente acción.');
    if (todayPlan(s, p.date).some((it) => it.taskId === t.id)) return ok(s);
    const n = copy(s),
      plan = planFor(n, p.date, iso);
    plan.taskIds.push(t.id);
    return ok(n);
  }
  function moveToFirst(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const current = s.plans.find((x) => x.date === p.date);
    if (!current || !current.taskIds.includes(p.taskId))
      return fail('La tarea no está en el plan de ese día.');
    if (current.taskIds[0] === p.taskId) return ok(s);
    const n = copy(s),
      plan = planFor(n, p.date, iso);
    plan.taskIds = [p.taskId].concat(plan.taskIds.filter((id) => id !== p.taskId));
    return ok(n);
  }
  function removeFromToday(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const n = copy(s),
      plan = n.plans.find((x) => x.date === p.date);
    if (!plan || !plan.taskIds.includes(p.taskId)) return ok(s);
    plan.taskIds = plan.taskIds.filter((id) => id !== p.taskId);
    plan.updatedAt = iso;
    return ok(n);
  }
  function markTaskDone(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const running = openSession(s);
    if (running && running.taskId === p.taskId)
      return fail('Cierra la sesión abierta para terminar esta tarea.');
    const n = copy(s),
      t = taskById(n, p.taskId);
    Object.assign(t, { status: 'done', completedAt: iso, updatedAt: iso });
    return ok(n);
  }
  function pauseTask(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const running = openSession(s);
    if (running && running.taskId === p.taskId)
      return fail('Cierra la sesión abierta antes de pausar la tarea.');
    if (taskById(s, p.taskId).status === 'done') return fail('Esta tarea ya está terminada.');
    const n = copy(s),
      t = taskById(n, p.taskId);
    t.status = 'paused';
    t.updatedAt = iso;
    n.plans.forEach((plan) => {
      if (plan.taskIds.includes(t.id)) {
        plan.taskIds = plan.taskIds.filter((id) => id !== t.id);
        plan.updatedAt = iso;
      }
    });
    return ok(n);
  }
  function resumeTask(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    if (taskById(s, p.taskId).status !== 'paused') return fail('La tarea no está en pausa.');
    const n = copy(s),
      t = taskById(n, p.taskId);
    t.status = t.nextAction ? 'active' : 'inbox';
    t.updatedAt = iso;
    return ok(n);
  }
  function rescheduleTask(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    if (!day(p.toDate) || !day(p.fromDate)) return fail('Elige una fecha válida.');
    if (p.toDate <= p.fromDate) return fail('Elige una fecha posterior al día de hoy.');
    const t = taskById(s, p.taskId);
    if (!t.nextAction || ['paused', 'done'].includes(t.status))
      return fail('Solo puedes mover una tarea activa con su acción definida.');
    const n = copy(s),
      from = n.plans.find((x) => x.date === p.fromDate);
    if (from) {
      from.taskIds = from.taskIds.filter((id) => id !== p.taskId);
      from.updatedAt = iso;
    }
    const to = planFor(n, p.toDate, iso);
    if (!to.taskIds.includes(p.taskId)) to.taskIds.push(p.taskId);
    return ok(n);
  }
  function startSession(s, p, iso) {
    const error = validTask(s, p.taskId, iso);
    if (error) return error;
    const running = openSession(s),
      t = taskById(s, p.taskId);
    if (running)
      return running.taskId === p.taskId
        ? ok(s)
        : fail('Ya tienes una sesión abierta. Ciérrala antes de empezar otra.');
    if (!t.nextAction) return fail('Define la siguiente acción antes de empezar.');
    if (['paused', 'done'].includes(t.status))
      return fail('Esta tarea no está disponible para una sesión.');
    const n = copy(s);
    n.sessions.push({
      id: uid('session'),
      taskId: t.id,
      title: t.title,
      action: t.nextAction,
      startedAt: iso,
      endedAt: null,
      pausedAt: null,
      pausedMs: 0,
      progress: null,
      nextStep: t.nextAction,
      finished: false,
      updatedAt: iso,
    });
    return ok(n);
  }
  function sessionChange(s, iso) {
    const x = openSession(s);
    if (!x) return fail('No hay una sesión abierta.');
    if (
      !stamp(iso) ||
      Date.parse(iso) < Date.parse(x.startedAt) ||
      Date.parse(iso) < Date.parse(x.updatedAt)
    )
      return fail('El reloj del equipo cambió. Revisa la fecha y vuelve a intentar.');
    const n = copy(s);
    return { ok: true, state: n, session: n.sessions.find((a) => a.id === x.id) };
  }
  function pauseSession(s, p, iso) {
    const r = sessionChange(s, iso);
    if (!r.ok) return r;
    if (r.session.pausedAt) return ok(s);
    r.session.pausedAt = iso;
    r.session.updatedAt = iso;
    return ok(r.state);
  }
  function resumeSession(s, p, iso) {
    const r = sessionChange(s, iso);
    if (!r.ok) return r;
    if (!r.session.pausedAt) return ok(s);
    r.session.pausedMs += Math.max(0, Date.parse(iso) - Date.parse(r.session.pausedAt));
    r.session.pausedAt = null;
    r.session.updatedAt = iso;
    return ok(r.state);
  }
  function closeSession(s, p, iso) {
    const r = sessionChange(s, iso);
    if (!r.ok) return r;
    if (!progress.includes(p.progress)) return fail('Elige cómo te fue en esta sesión.');
    const next =
      p.nextStep === undefined ? taskById(s, r.session.taskId).nextAction : text(p.nextStep);
    if (!p.finished && (!next || next.length > 500))
      return fail('Define el siguiente paso (máximo 500 caracteres).');
    const x = r.session,
      t = taskById(r.state, x.taskId);
    if (x.pausedAt) x.pausedMs += Math.max(0, Date.parse(iso) - Date.parse(x.pausedAt));
    Object.assign(x, {
      endedAt: iso,
      pausedAt: null,
      progress: p.finished ? 'yes' : p.progress,
      nextStep: p.finished ? null : next,
      finished: !!p.finished,
      updatedAt: iso,
    });
    if (p.finished) Object.assign(t, { status: 'done', completedAt: iso, updatedAt: iso });

    return ok(r.state);
  }
  function sessionDuration(x, iso) {
    const until = x.endedAt || x.pausedAt || iso;
    if (!stamp(until)) return 0;

  function sessionsBetween(s, from, to) {
    const start = Date.parse(from);
    const end = Date.parse(to);

  // marca ISO 8601 UTC
  function now() {
    return new Date().toISOString();
  }
  // fecha local YYYY-MM-DD
  function localDate() {
    var d = new Date();
    return (
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
    );
  }
  function pad(n) {
    return (n < 10 ? "0" : "") + n;
  }

  var DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  var DIAS_LARGOS = [
    "Domingo",
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado",
  ];
  var MESES = [
    "ene",
    "feb",
    "mar",
    "abr",
    "may",
    "jun",
    "jul",
    "ago",
    "sep",
    "oct",
    "nov",
    "dic",
  ];

  // 'YYYY-MM-DD' a Date local a medianoche
  function parseLocalDate(s) {
    var a = s.split("-");
    return new Date(+a[0], +a[1] - 1, +a[2]);
  }
  // rango [inicio, fin) de un día local como marcas ISO UTC
  function localDayRange(s) {
    var start = parseLocalDate(s);
    var end = new Date(
      start.getFullYear(),
      start.getMonth(),
      start.getDate() + 1,
    );
    return { startIso: start.toISOString(), endIso: end.toISOString() };
  }
  // las fechas de la semana (lunes a hoy) que contiene s
  function weekUpToToday(s) {
    var d = parseLocalDate(s);
    var offset = (d.getDay() + 6) % 7;
    var out = [];
    for (var i = offset; i >= 0; i--) {
      var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
      out.push(
        x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate()),
      );
    }
    return out;
  }
  function fmtDayName(s) {
    return DIAS[parseLocalDate(s).getDay()];
  }
  function fmtDayDate(s) {
    var d = parseLocalDate(s);
    return d.getDate() + " " + MESES[d.getMonth()];
  }
  function fmtHeaderDate(s) {
    var d = parseLocalDate(s);
    return DIAS_LARGOS[d.getDay()] + " " + d.getDate();
  }
  // marca ISO a '9 abr, 14:03'
  function fmtStamp(iso) {
    var d = new Date(iso);
    return (
      d.getDate() +
      " " +
      MESES[d.getMonth()] +
      ", " +
      d.getHours() +
      ":" +
      pad(d.getMinutes())
    );
  }
  // marca ISO a solo la hora '14:03'
  function fmtClock(iso) {
    var d = new Date(iso);
    return d.getHours() + ":" + pad(d.getMinutes());
  }
  // mes local 'YYYY-MM' de una marca ISO
  function monthOf(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }
  // solo la primera letra en mayúscula, como se escribe en español: 'Octubre de 2026'
  function capitalize(text) {
    return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
  }
  // tamaño del titular según su largo, para que la acción y sus botones sigan a la vista
  function heroSize(text) {
    var n = String(text || "").length;
    return n > 180 ? " hero--long hero--xlong" : n > 120 ? " hero--long" : "";
  }

  // ---------- estado de la aplicación ----------
  var STATE = Core.emptyState(); // única fuente de verdad
  var VIEW = { name: "hoy" }; // vista actual y datos transitorios de interfaz
  var SAVE = "saved"; // 'saved' | 'saving' | 'error'
  var SYNC = "off"; // 'off' | 'ok' | 'localonly'
  var elapsedTimer = null; // solo repinta el tiempo transcurrido
  var UNDO = null; // { state, label } del deshacer breve
  var undoTimer = null; // temporizador del aviso de deshacer
  var saveSeq = 0; // número del último guardado pedido: una respuesta vieja no pisa el indicador
  var REDUCE = false;
  try {
    REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}

  var adapter = makeAdapter();

  // calcula una fecha YYYY-MM-DD desplazada por días
  function localPlus(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return (
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
    );
  }

  // ---------- utilidades ----------
  // escapa el texto de la persona antes de insertarlo en HTML
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c];
    });
  }

  // texto de búsqueda comparable sin diferencias de mayúsculas ni acentos
  function foldSearch(text) {
    return String(text || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }

  // duración legible larga a partir de milisegundos
  function fmtDur(ms) {
    var totalMin = Math.floor(ms / 60000);
    if (totalMin < 1) return "menos de 1 min";
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h < 1) return m + " min";
    return h + " h " + pad(m) + " min";
  }
  // duración compacta para las cifras de Progreso
  function fmtDurShort(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 60) return m + " min";
    var h = Math.floor(m / 60);
    var r = m % 60;
    return r ? h + " h " + r : h + " h";
  }

  // texto del indicador de guardado, honesto sobre dónde quedaron los datos
  function saveText() {
    if (DEMO_PREV !== null) return "Ejemplo · no se guarda";
    if (RECOVERY_RAW !== null) return "Datos pendientes de recuperar";
    var time = STATE.savedAt ? " · " + fmtClock(STATE.savedAt) : "";
    if (SAVE === "saving")
      return SYNC === "off" ? "Guardando…" : "Sincronizando…";
    if (SAVE === "error") return "No se pudo guardar · exporta una copia";
    if (LOAD_NOTICE && !STATE.savedAt) return "Guardado local no disponible";
    if (SYNC === "off") return "Guardado en este navegador" + time;
    return SYNC === "localonly"
      ? "Guardado solo en este navegador" + time
      : "Sincronizado" + time;
  }

  // busca una tarea por id para la interfaz
  function findTaskUi(id) {
    return Core.taskById(STATE, id);
  }

  // clase y palabra del resultado de una sesión, derivadas de lo que se guardó
  function outcomeKind(s) {
    if (s.finished || s.nextStep === null || s.progress === "yes")
      return "done";
    if (s.progress === "some") return "progress";
    return "stuck";
  }
  function outcomeWord(s) {
    if (s.finished || s.nextStep === null) return "Tarea terminada";
    if (s.progress === "yes") return "Avanzaste bien";
    if (s.progress === "some") return "Avanzaste un poco";
    return "Sin avance, pero con tiempo dedicado";
  }

  // posición de la marca sobre la línea: una pasada por hora, solo señal de que el tiempo corre (no se llena ni marca una meta)
  function tempoPos(ms) {
    return ((((ms / 1000) % 3600) / 3600) * 88).toFixed(2);
  }

  // ---------- guardado ----------
  // adopta un estado nuevo, repinta y guarda solo si cambió
  function apply(next) {
    if (RECOVERY_RAW !== null) {
      announce("Recupera tus datos desde Ajustes antes de hacer cambios.");
      return false;
    }
    if (EXTERNAL_CHANGED) {
      announce("Hay cambios en otra pestaña. Recarga para no sobrescribirlos.");
      return false;
    }
    clearUndo();
    if (next === STATE) {
      render();
      return true;
    }
    STATE = Core.stampSave(next, now());
    if (DEMO_PREV !== null) {
      SAVE = "saved";
      render();
      return true;
    }
    SAVE = "saving";
    render();
    var submitted = STATE,
      seq = ++saveSeq;
    adapter.save(submitted).then(
      function (resolved) {
        if (resolved && typeof resolved === "object" && STATE === submitted) {
          var checked = Core.validateState(Core.migrate(resolved));
          if (checked.ok) {
            STATE = Core.migrate(resolved);
            render();
          }
        }
        if (seq === saveSeq) {
          SAVE = "saved";
          refreshSaveIndicator();
        }
      },
      function () {
        if (seq === saveSeq) {
          SAVE = "error";
          refreshSaveIndicator();
          announce(
            "No se pudo guardar. Tus cambios siguen en pantalla: exporta una copia desde Ajustes.",
          );
        }
      },
    );
    return true;
  }

  // actualiza solo el indicador, sin repintar toda la vista
  function refreshSaveIndicator() {
    var el = document.getElementById("saveind");
    if (el) el.textContent = saveText();
    var icon = document.getElementById("save-icon");
    if (icon)
      icon.innerHTML =
        SAVE === "error" || LOAD_NOTICE
          ? ICON.warning
          : SAVE === "saving"
            ? ICON.clock
            : ICON.check;
  }

  // ---------- deshacer breve: una ventana de 10 s tras acciones destructivas ----------
  function setUndo(prevState, label) {
    UNDO = { state: prevState, label: label };
    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      UNDO = null;
      undoTimer = null;
      var el = document.getElementById("undobar");
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }, 10000);
    render();
  }

  function clearUndo() {
    UNDO = null;
    if (undoTimer) {
      clearTimeout(undoTimer);
      undoTimer = null;
    }
  }

  function doUndo() {
    if (!UNDO) return;
    var prev = UNDO.state;
    UNDO = null;
    if (undoTimer) {
      clearTimeout(undoTimer);
      undoTimer = null;
    }
    VIEW = { name: "hoy" };
    apply(prev);
  }

  function undoBarHtml() {
    if (!UNDO) return "";
    return (
      '<div class="notice undobar" id="undobar"><span>' +
      esc(UNDO.label) +
      "</span>" +
      '<button type="button" class="link" data-action="undo">Deshacer</button></div>'
    );
  }

  // ---------- acciones de interfaz ----------
  // captura el nombre sin exigir la acción y abre su campo dentro de Bandeja
  function doCapture(title) {
    var r = Core.captureTask(STATE, { title: title }, now());
    if (!r.ok) {
      announce(r.error);
      return;
    }
    if (RECOVERY_RAW !== null || EXTERNAL_CHANGED) {
      apply(r.state);
      return;
    }
    CAPTURE_DRAFT = "";
    var task = r.state.tasks[r.state.tasks.length - 1];
    VIEW = { name: "bandeja", editTaskId: task.id, focusAction: true };
    apply(r.state);
    announce("Tarea capturada. Define ahora su siguiente acción.");
  }

  // elegir para hoy; si falta acción, se escribe en la misma tarjeta
  function doChooseForToday(taskId) {
    var r = Core.chooseForToday(
      STATE,
      { taskId: taskId, date: localDate() },
      now(),
    );
    if (r.ok) {
      VIEW = { name: "hoy" };
      apply(r.state);
      announce("Tarea añadida al plan de hoy.");
      return;
    }
    var task = findTaskUi(taskId);
    if (!task || task.nextAction) {
      announce(r.error);
      return;
    }
    VIEW = {
      name: "bandeja",
      editTaskId: taskId,
      chooseAfterAction: true,
      focusAction: true,
    };
    render();
  }

  // guarda la acción desde Bandeja y elige para hoy si se pidió al abrirla
  function onSaveInlineAction() {
    var input = document.getElementById("inline-action");
    var task = findTaskUi(VIEW.editTaskId);
    if (!input || !task) return;
    var r = Core.defineTask(
      STATE,
      {
        taskId: task.id,
        outcome: task.outcome,
        nextAction: input.value,
      },
      now(),
    );
    if (!r.ok) {
      VIEW.actionError = r.error;
      VIEW.actionDraft = input.value;
      VIEW.focusAction = true;
      render();
      return;
    }
    var next = r.state;
    if (VIEW.chooseAfterAction) {
      var chosen = Core.chooseForToday(
        next,
        { taskId: task.id, date: localDate() },
        now(),
      );
      if (chosen.ok) {
        VIEW = { name: "hoy" };
        apply(chosen.state);
        return;
      }
    }
    var inToday = Core.todayPlan(next, localDate()).some(function (it) {
      return it.taskId === task.id;
    });
    VIEW = inToday
      ? { name: "bandeja", focusCapture: true }
      : { name: "bandeja", focusChooseId: task.id };
    apply(next);
  }

  // subir una tarea al primer lugar del plan de hoy
  function doMoveToFirst(taskId) {
    var r = Core.moveToFirst(
      STATE,
      { date: localDate(), taskId: taskId },
      now(),
    );
    if (r.ok) apply(r.state);
    else announce(r.error);
  }

  // quitar una tarea del plan de hoy y volver a Hoy
  function doRemoveFromToday(taskId) {
    var r = Core.removeFromToday(
      STATE,
      { date: localDate(), taskId: taskId },
      now(),
    );
    if (r.ok) {
      VIEW = { name: "hoy" };
      apply(r.state);
    }
  }

  // marcar una tarea como terminada directamente y volver a Hoy
  function doMarkDone(taskId) {
    var prev = STATE;
    var r = Core.markTaskDone(STATE, { taskId: taskId }, now());
    if (r.ok) {
      VIEW = { name: "hoy" };
      if (apply(r.state)) setUndo(prev, "Tarea terminada.");
    } else announce(r.error);
  }

  // pausar: aparta la tarea de todos los planes y vuelve a Hoy
  function doPause(id) {
    var r = Core.pauseTask(STATE, { taskId: id }, now());
    if (!r.ok) {
      announce(r.error);
      return;
    }
    var previous = STATE;
    VIEW = { name: "bandeja", inboxFilter: "paused" };
    if (apply(r.state)) setUndo(previous, "Tarea puesta en pausa.");
  }

  // reprogramar: confirma el traslado de la tarea al plan de la fecha elegida
  function onSaveReschedule() {
    var input = document.getElementById("rs-date");
    var toDate = input ? input.value : "";
    VIEW.rescheduleDraft = toDate;
    var r = Core.rescheduleTask(
      STATE,
      { taskId: VIEW.taskId, fromDate: localDate(), toDate: toDate },
      now(),
    );
    if (!r.ok) {
      VIEW.rescheduleError = r.error;
      render();
      var field = document.getElementById("rs-date");
      if (field) field.focus();
      return;
    }
    VIEW = { name: "hoy" };
    apply(r.state);
  }

  // empezar: abre una sesión y muestra la vista Sesión
  function doStart(taskId) {
    var r = Core.startSession(STATE, { taskId: taskId }, now());
    if (!r.ok) {
      announce(r.error);
      return;
    }
    VIEW = { name: "sesion", focusHeading: true };
    apply(r.state);
  }

  // pausar la sesión abierta: el tiempo se congela hasta reanudar
  function doPauseSession() {
    var r = Core.pauseSession(STATE, {}, now());
    if (r.ok) {
      apply(r.state);
      announce("Sesión en pausa. El tiempo de pausa no se registra.");
    } else announce(r.error);
  }

  // reanudar la sesión en pausa
  function doResumeSession() {
    var r = Core.resumeSession(STATE, {}, now());
    if (r.ok) {
      apply(r.state);
      announce("Sesión reanudada.");
    } else announce(r.error);
  }

  // edita solo la acción; conserva el resultado que traigan tareas antiguas
  function onSaveDefine() {
    var n = document.getElementById("d-next"),
      title = document.getElementById("d-title"),
      outcome = document.getElementById("d-outcome");
    var task = findTaskUi(VIEW.taskId);
    if (!task) return;
    var r = Core.defineTask(
      STATE,
      {
        taskId: VIEW.taskId,
        title: title ? title.value : task.title,
        outcome: outcome ? outcome.value : task.outcome,
        nextAction: n ? n.value : "",
      },
      now(),
    );
    if (!r.ok) {
      var titleText = (title ? title.value : task.title || "").trim();
      VIEW.defineError = r.error;
      // el campo que causa el error: nombre vacío o largo, o acción vacía
      VIEW.defineField =
        !titleText || titleText.length > 240
          ? "d-title"
          : !(n && n.value.trim())
            ? "d-next"
            : null;
      VIEW.draftNext = n ? n.value : "";
      VIEW.draftTitle = title ? title.value : task.title;
      VIEW.draftOutcome = outcome ? outcome.value : task.outcome;
      render();
      var el = document.getElementById(VIEW.defineField || "d-next");
      if (el) el.focus();
      return;
    }
    VIEW = { name: VIEW.back || "hoy" };
    apply(r.state);
    announce("Tarea actualizada.");
  }

  // un sí o un no cierra la sesión, sin dar por terminada la tarea
  function doCloseSession(progress) {
    var complete = document.getElementById("cl-finished"),
      next = document.getElementById("cl-next");
    var r = Core.closeSession(
      STATE,
      {
        progress: progress,
        finished: !!(complete && complete.checked),
        nextStep: next ? next.value : undefined,
      },
      now(),
    );
    if (!r.ok) {
      VIEW.closeError = r.error;
      var error = document.getElementById("close-error");
      if (error) {
        error.textContent = r.error;
        error.hidden = false;
      }
      if (next && !next.disabled && !next.value.trim()) {
        next.setAttribute("aria-invalid", "true");
        next.setAttribute("aria-describedby", "close-error");
        next.focus();
      } else announce(r.error);
      return;
    }
    stopElapsed();
    VIEW = { name: "hoy", focusHeading: true };
    apply(r.state);
    announce("Sesión guardada. Cada paso cuenta.");
  }

  // exportar el estado como archivo JSON
  function doExport() {
    downloadText(Core.exportState(STATE), "siguiente-" + localDate() + ".json");
  }

  // importar un archivo JSON: avisa si es más nuevo; el núcleo valida y reemplaza
  function doImport(file) {
    if (file.size > 5 * 1024 * 1024) {
      VIEW.importError = "El archivo supera los 5 MB.";
      render();
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var r = Core.importState(STATE, String(reader.result));
      if (!r.ok) {
        VIEW.importError = r.error;
        PENDING_IMPORT = null;
        render();
        return;
      }
      PENDING_IMPORT = r.state;
      VIEW.importError = null;
      render();
      var confirm = document.getElementById("import-confirm");
      if (confirm) confirm.focus();
    };
    reader.onerror = function () {
      VIEW.importError = "No se pudo leer el archivo.";
      render();
    };
    reader.readAsText(file);
  }

  // borrar todo, tras confirmación
  function doDeleteAll() {
    var previous = STATE;
    var incompatible = RECOVERY_RAW !== null;
    RECOVERY_RAW = null;
    LOAD_NOTICE = "";
    EXTERNAL_CHANGED = false;
    PENDING_IMPORT = null;
    CAPTURE_DRAFT = "";
    stopElapsed();
    VIEW = { name: "hoy" };
    apply(Core.emptyState());
    if (!incompatible) setUndo(previous, "Se borraron las tareas y sesiones.");
  }

  // Iconos SVG de trazo uniforme: decorativos, con nombre en el control.
  function svg(path) {
    return (
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      path +
      "</svg>"
    );
  }
  var ICON = {
    hoy: svg(
      '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',

  // ---------- render ----------
  var lastViewKey = null; // la entrada de vista solo se anima al cambiar de sección
  function render() {
    var app = document.getElementById("app");
    paintThemeColor();
    var announcementNode = document.getElementById("announcement");
    var previousWorkspace = document.getElementById("main-content");
    var previousScroll = previousWorkspace ? previousWorkspace.scrollTop : 0;
    var previousWindowScroll = window.scrollY;
    var oldFocus = document.activeElement,
      focusId = oldFocus && oldFocus.id;
    var nextKey = VIEW.name + "|" + (VIEW.menu ? "menu" : "");
    if (nextKey === lastViewKey) {
      var oldInline = document.getElementById("inline-action");
      if (
        oldInline &&
        oldInline.getAttribute("data-task-id") === VIEW.editTaskId
      )
        VIEW.actionDraft = oldInline.value;
      var oldDefine = document.getElementById("define-form");
      if (oldDefine && oldDefine.getAttribute("data-task-id") === VIEW.taskId) {
        VIEW.draftNext = document.getElementById("d-next").value;
        VIEW.draftTitle = document.getElementById("d-title").value;
        VIEW.draftOutcome = document.getElementById("d-outcome").value;
      }
      var oldDate = document.getElementById("rs-date");
      if (oldDate) VIEW.rescheduleDraft = oldDate.value;
      var oldClose = document.getElementById("close-form");
      if (oldClose) {
        VIEW.closeDraftNext = document.getElementById("cl-next").value;
        VIEW.closeFinished = document.getElementById("cl-finished").checked;
        var selected = document.querySelector(
          '[name="session-progress"]:checked',
        );
        VIEW.closeProgress = selected ? selected.value : "yes";
      }
    }
    var keepCapture = focusId === "capture" && !VIEW.focusAction;
    var full = (VIEW.name === "sesion" || VIEW.name === "cerrar") && !VIEW.menu;
    var key = VIEW.name + "|" + (VIEW.menu ? "menu" : "");
    var entering = key !== lastViewKey;
    lastViewKey = key;
    var body = VIEW.menu ? menuHtml() : viewHtml();
    if (!full && !VIEW.menu) body = undoBarHtml() + body;
    var demo =
      DEMO_PREV !== null
        ? '<div class="demo-banner"><span>Modo de ejemplo · los cambios no se guardan.</span><button type="button" class="link" data-action="demo-exit">Salir</button></div>'
        : "";
    var chrome = full
      ? '<div class="session-top"><button type="button" class="link" data-action="go" data-view="hoy">' +
        ICON.left +
        'Volver a Hoy</button><span class="saveind" id="saveind">' +
        esc(saveText()) +
        '</span></div><div id="status-message-slot" class="session-feedback"></div>'
      : appbarHtml() + captureSlot();
    app.innerHTML =
      sidebarHtml() +
      '<main class="workspace" id="main-content" tabindex="-1"><div class="content">' +
      chrome +
      demo +
      recoveryNoticeHtml() +
      '<div class="view' +
      (full ? " view--full" : "") +
      (entering ? " view--enter" : "") +
      '">' +
      body +
      "</div></div></main>" +
      tabbarHtml();
    var statusSlot = document.getElementById("status-message-slot");
    if (statusSlot && announcementNode)
      statusSlot.appendChild(announcementNode);
    // solo se escribe si cambió: no pisa un título puesto desde fuera
    var title = pageTitle();
    if (title !== lastTitle) {
      document.title = title;
      lastTitle = title;
    }
    wire();
    var currentWorkspace = document.getElementById("main-content");
    if (!entering) {
      currentWorkspace.scrollTop = previousScroll;
      window.scrollTo({ top: previousWindowScroll, behavior: "instant" });
    } else {
      currentWorkspace.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: "instant" });
    }
    if (keepCapture || VIEW.focusCapture) {
      var cap = document.getElementById("capture");
      if (cap) {
        cap.focus({ preventScroll: true });
        if (VIEW.focusCapture)
          cap.scrollIntoView({ block: "center", behavior: "instant" });
      }
      VIEW.focusCapture = false;
    }
    if (VIEW.focusAction) {
      var actionInput = document.getElementById("inline-action");
      if (actionInput) {
        actionInput.focus({ preventScroll: true });
        actionInput.scrollIntoView({ block: "nearest" });
      }
      VIEW.focusAction = false;
    }
    if (VIEW.focusChooseId) {
      var choose = document.getElementById("choose-action");
      if (choose) {
        choose.focus({ preventScroll: true });
        choose.scrollIntoView({ block: "nearest" });
      }
      VIEW.focusChooseId = null;
    }
    if (VIEW.focusHeading && !keepCapture) {
      var heading = document.querySelector("#main-content h1");
      if (heading) heading.focus({ preventScroll: true });
      VIEW.focusHeading = false;
    }
    if (!entering && focusId && focusId !== "capture" && !VIEW.focusAction) {
      var restore = document.getElementById(focusId);
      if (restore && !restore.disabled && restore.getClientRects().length)
        restore.focus({ preventScroll: true });

  }

            esc(item.task.title) +
            '</span></span><button type="button" class="iconbtn" data-action="tofirst" data-id="' +
            esc(item.taskId) +
            '" aria-label="Hacer primero: ' +
            esc(item.task.title) +

        });

      }
      html +=
        '<div class="plan-footer"><p>Un plan pequeño deja espacio para avanzar.</p><button type="button" class="link" data-action="go" data-view="bandeja">Ver bandeja ' +

  // Bandeja: tareas en inbox o active, con dos acciones por tarea
  function bandejaHtml() {
    var filter = VIEW.inboxFilter || "pending",
      query = foldSearch(VIEW.inboxQuery || ""),
      today = Core.todayPlan(STATE, localDate());
    var inToday = {};
    today.forEach(function (it) {
      inToday[it.taskId] = true;
    });
    var all = STATE.tasks
      .filter(function (t) {
        return (
          (filter === "all" ||
            (filter === "pending" && ["inbox", "active"].includes(t.status)) ||
            t.status === filter) &&
          foldSearch(t.title + " " + (t.nextAction || "")).includes(query)
        );
      })
      .sort(function (a, b) {
        return Date.parse(b.createdAt) - Date.parse(a.createdAt);
      });
    var limit = VIEW.inboxLimit || 30,
      tasks = all.slice(0, limit);
    var html =
      sessionBanner() +
      '<div class="inbox-controls"><div class="search-field">' +
      ICON.search +
      '<label class="sr-only" for="inbox-search">Buscar tareas</label><input class="log-search" id="inbox-search" type="search" placeholder="Buscar una tarea…" value="' +
      esc(VIEW.inboxQuery || "") +
      '"></div><label class="sr-only" for="inbox-filter">Estado de las tareas</label><select id="inbox-filter" class="filter-select">' +
      [
        ["pending", "Pendientes"],
        ["paused", "En pausa"],
        ["done", "Terminadas"],
        ["all", "Todas las tareas"],
      ]
        .map(function (it) {
          return (
            '<option value="' +
            it[0] +
            '"' +
            (filter === it[0] ? " selected" : "") +
            ">" +
            it[1] +
            "</option>"
          );
        })
        .join("") +
      '</select></div><p class="results-count">' +
      all.length +
      (all.length === 1 ? " tarea" : " tareas") +
      (query ? (all.length === 1 ? " encontrada" : " encontradas") : "") +
      "</p>";
    VIEW.inboxSummary =
      query && !all.length
        ? "No encontramos esa tarea."
        : all.length +
          (all.length === 1 ? " tarea" : " tareas") +
          (query ? (all.length === 1 ? " encontrada" : " encontradas") : "");
    if (!tasks.length) {
      return (
        html +
        '<section class="plain-empty">' +
        ICON.bandeja +
        "<h2>" +
        (query
          ? "No encontramos esa tarea."
          : filter === "done"
            ? "Cada cierre aparecerá aquí."
            : filter === "paused"
              ? "No hay tareas en pausa."
              : "Tu cabeza puede descansar.") +
        "</h2><p>" +
        (query
          ? "Prueba con otra palabra o cambia el filtro."
          : filter === "paused"
            ? "Si apartas una tarea, podrás recuperarla desde esta vista."
            : filter === "done"
              ? "Las tareas que termines se conservarán en tu registro."
              : "Anota arriba la primera tarea que tienes en mente.") +
        "</p></section>"
      );
    }
    html += '<ul class="rows">';
    tasks.forEach(function (t) {
      var editing = VIEW.editTaskId === t.id,
        dur = Core.taskTotalDuration(STATE, t.id),
        pending = ["inbox", "active"].includes(t.status);
      html +=
        '<li class="task' +
        (editing ? " task--captured" : "") +
        '"><div class="t-topline"><div class="t-title">' +
        esc(t.title) +
        '</div><span class="t-tag' +
        (t.status === "done"
          ? " badge--green"
          : inToday[t.id]
            ? " badge--accent"
            : "") +
        '">' +
        (t.status === "done"
          ? "Terminada"
          : t.status === "paused"
            ? "En pausa"
            : inToday[t.id]
              ? "En tu plan de hoy"
              : t.nextAction
                ? "Lista para empezar"
                : "Por definir") +
        "</span></div>";
      if (!editing)
        html +=
          '<div class="t-next' +
          (!t.nextAction ? " none" : "") +
          '">' +
          (t.nextAction ? esc(t.nextAction) : "Todavía sin siguiente acción") +
          "</div>";
      if (dur)
        html +=
          '<p class="t-dur">' +
          ICON.clock +
          esc(fmtDur(dur)) +
          " de enfoque</p>";
      if (editing) {
        var action =
          "actionDraft" in VIEW ? VIEW.actionDraft : t.nextAction || "";
        if (VIEW.actionError)
          html +=
            '<p class="notice notice--error" id="action-error" role="alert">' +
            esc(VIEW.actionError) +
            "</p>";
        html +=
          '<label class="field" for="inline-action"><span>¿Cuál es el siguiente paso?</span></label><input id="inline-action" data-task-id="' +
          esc(t.id) +
          '" class="capture" type="text" maxlength="500" autocomplete="off" placeholder="Ej.: escribir el primer párrafo" value="' +
          esc(action) +
          '"' +
          (VIEW.actionError
            ? ' aria-invalid="true" aria-describedby="action-error"'
            : "") +
          '><p class="action-hint">Algo pequeño, concreto y que puedas empezar ahora.</p><div class="t-actions"><button type="button" class="btn btn--primary btn--small" data-action="save-inline-action">' +
          (VIEW.chooseAfterAction
            ? "Guardar y elegir para hoy"
            : "Guardar acción") +
          '</button><button type="button" class="link" data-action="cancel-inline-action">Ahora no</button></div>';
      } else if (pending) {
        html +=
          '<div class="t-actions"><button type="button" class="btn btn--quiet btn--small" data-action="edit-inline-action" data-id="' +
          esc(t.id) +
          '">' +
          (t.nextAction ? "Editar acción" : "Definir acción") +
          "</button>" +
          (inToday[t.id]
            ? '<button type="button" class="link" data-action="adjust" data-id="' +
              esc(t.id) +
              '">Más opciones</button>'
            : '<button type="button" class="btn btn--primary btn--small" data-action="choose" data-id="' +
              esc(t.id) +
              '"' +
              (VIEW.focusChooseId === t.id ? ' id="choose-action"' : "") +
              ">Elegir para hoy</button>") +
          "</div>";
      } else if (t.status === "paused") {
        html +=
          '<div class="t-actions"><button type="button" class="btn btn--quiet btn--small" data-action="task-resume" data-id="' +
          esc(t.id) +
          '">' +
          ICON.play +
          "Recuperar tarea</button></div>";
      }
      html += "</li>";
    });
    html += "</ul>";
    if (all.length > limit)
      html +=
        '<button type="button" class="btn btn--quiet more-button" id="inbox-more" data-action="inbox-more">Mostrar más tareas (' +
        (all.length - limit) +
        ")</button>";
    return html;
  }
